---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: le-postgres
  namespace: le-postgres
  labels:
    app: le-postgres
    project: linkedeye
spec:
  replicas: 1
  selector:
    matchLabels:
      app: le-postgres
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: le-postgres
        project: linkedeye
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432

          env:
            # Superuser credentials
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: le-postgres-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: le-postgres-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: "postgres"

            # Per-tool passwords (used by init script)
            - name: JENKINS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: le-postgres-secret
                  key: JENKINS_PASSWORD
            - name: HARBOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: le-postgres-secret
                  key: HARBOR_PASSWORD
            - name: KEYCLOAK_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: le-postgres-secret
                  key: KEYCLOAK_PASSWORD
            - name: VAULT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: le-postgres-secret
                  key: VAULT_PASSWORD
            - name: ARGOCD_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: le-postgres-secret
                  key: ARGOCD_PASSWORD
            - name: REDMINE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: le-postgres-secret
                  key: REDMINE_PASSWORD
            - name: ITSM_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: le-postgres-secret
                  key: ITSM_PASSWORD

          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true

          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi

          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "leadmin"]
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 5

          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "leadmin"]
            initialDelaySeconds: 10
            periodSeconds: 5

      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: le-postgres-pvc
        - name: init-scripts
          configMap:
            name: le-postgres-init
            defaultMode: 0755
