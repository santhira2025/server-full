# ============================================================
# Per-tool DB secrets — created in each tool's namespace
# so each tool can reference its own credentials
# Apply with: kubectl apply -f 08-tool-secrets.yaml
# ============================================================

---
# Jenkins namespace secret
apiVersion: v1
kind: Secret
metadata:
  name: le-jenkins-db-secret
  namespace: jenkins
  labels:
    app: jenkins
    project: linkedeye
type: Opaque
stringData:
  POSTGRES_HOST: "le-postgres-svc.le-postgres.svc.cluster.local"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "jenkinsdb"
  POSTGRES_USER: "jenkins"
  POSTGRES_PASSWORD: "Jenkins@FinSpot2025!"

