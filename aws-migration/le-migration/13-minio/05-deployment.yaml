---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: minio
  labels:
    app: minio
    project: linkedeye
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  strategy:
    type: Recreate    # Single-node — avoid split-brain
  template:
    metadata:
      labels:
        app: minio
        project: linkedeye
    spec:
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsNonRoot: true

      initContainers:
        # Fix permissions on data directory
        - name: fix-permissions
          image: busybox:1.35
          command: ["sh", "-c", "chown -R 1000:1000 /data && chmod 750 /data"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: minio-data
              mountPath: /data

      containers:
        - name: minio
          image: quay.io/minio/minio:RELEASE.2024-01-01T00-00-00Z
          command:
            - minio
            - server
            - /data
            - --console-address
            - ":9001"
          ports:
            - name: api
              containerPort: 9000    # S3 API
            - name: console
              containerPort: 9001    # Web console

          envFrom:
            - configMapRef:
                name: minio-config
            - secretRef:
                name: minio-secret

          volumeMounts:
            - name: minio-data
              mountPath: /data

          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi

          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3

      volumes:
        - name: minio-data
          persistentVolumeClaim:
            claimName: minio-data-pvc
