---
# MinIO root credentials + per-service access keys
apiVersion: v1
kind: Secret
metadata:
  name: minio-secret
  namespace: minio
  labels:
    app: minio
    project: linkedeye
type: Opaque
stringData:
  # Root admin credentials
  MINIO_ROOT_USER: "minioadmin"
  MINIO_ROOT_PASSWORD: "Minio@FinSpot2025!"     # Change before production — min 8 chars

  # Per-service access keys (created post-deploy via MinIO console)
  # Jenkins — for artifact/cache storage
  JENKINS_ACCESS_KEY: "jenkins-access-key"
  JENKINS_SECRET_KEY: "jenkins-secret-key-change"

  # Velero — for K8s backup storage
  VELERO_ACCESS_KEY: "velero-access-key"
  VELERO_SECRET_KEY: "velero-secret-key-change"

  # Harbor — for container image storage (optional)
  HARBOR_ACCESS_KEY: "harbor-access-key"
  HARBOR_SECRET_KEY: "harbor-secret-key-change"

  # Grafana — for dashboard/snapshot storage
  GRAFANA_ACCESS_KEY: "grafana-access-key"
  GRAFANA_SECRET_KEY: "grafana-secret-key-change"
