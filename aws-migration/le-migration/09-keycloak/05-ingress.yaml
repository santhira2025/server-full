---
# Keycloak ALB Ingress
# URL: https://le-keycloak.finspot.in
# TLS: GoDaddy wildcard *.finspot.in
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak-ingress
  namespace: keycloak
  labels:
    app: keycloak
    project: linkedeye
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/certificate-source: k8s
    alb.ingress.kubernetes.io/healthcheck-path: /health/ready
    alb.ingress.kubernetes.io/healthcheck-port: "9000"
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "30"
    alb.ingress.kubernetes.io/success-codes: "200"
    alb.ingress.kubernetes.io/group.name: linkedeye-tools   # Shared ALB
    alb.ingress.kubernetes.io/tags: "Project=LinkedEye,Environment=prod"
spec:
  tls:
    - hosts:
        - le-keycloak.finspot.in
      secretName: finspot-tls

  rules:
    - host: le-keycloak.finspot.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak-svc
                port:
                  number: 8080
