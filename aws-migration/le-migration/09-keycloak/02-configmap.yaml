---
# Keycloak Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-config
  namespace: keycloak
  labels:
    app: keycloak
    project: linkedeye
data:
  KC_DB: "postgres"
  KC_DB_URL_HOST: "le-postgres-svc.le-postgres.svc.cluster.local"
  KC_DB_URL_PORT: "5432"
  KC_DB_URL_DATABASE: "keycloakdb"
  KC_DB_SCHEMA: "public"
  KC_HOSTNAME: "le-keycloak.finspot.in"
  KC_HOSTNAME_STRICT: "false"
  KC_HOSTNAME_STRICT_HTTPS: "true"
  KC_HTTP_ENABLED: "true"
  KC_HTTP_PORT: "8080"
  KC_PROXY: "edge"                # Behind ALB (TLS terminated at ALB)
  KC_PROXY_ADDRESS_FORWARDING: "true"
  KC_LOG_LEVEL: "INFO"
  KC_FEATURES: "token-exchange,admin-fine-grained-authz"
  KEYCLOAK_STATISTICS: "all"

  # Realm config: LinkedEye realm for all clients
  # Realms are configured post-deploy via Admin Console or import
  # Admin console: https://le-keycloak.finspot.in/admin

---
# Keycloak Admin Secrets
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-secret
  namespace: keycloak
  labels:
    app: keycloak
    project: linkedeye
type: Opaque
stringData:
  KEYCLOAK_ADMIN: "admin"
  KEYCLOAK_ADMIN_PASSWORD: "Keycloak@FinSpot2025!"   # Change before production
  KC_DB_USERNAME: "keycloak"
  KC_DB_PASSWORD: "Keycloak@FinSpot2025!"
