---
# Vault ALB Ingress
# URL: https://ls-vault.finspot.in
# TLS: GoDaddy wildcard *.finspot.in
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vault-ingress
  namespace: vault
  labels:
    app: vault
    project: linkedeye
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/certificate-source: k8s
    alb.ingress.kubernetes.io/healthcheck-path: /v1/sys/health?standbyok=true
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "30"
    alb.ingress.kubernetes.io/success-codes: "200,429"   # 429 = sealed (still healthy)
    alb.ingress.kubernetes.io/group.name: linkedeye-tools
    alb.ingress.kubernetes.io/tags: "Project=LinkedEye,Environment=prod"
spec:
  tls:
    - hosts:
        - ls-vault.finspot.in
      secretName: finspot-tls

  rules:
    - host: ls-vault.finspot.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vault
                port:
                  number: 8200
