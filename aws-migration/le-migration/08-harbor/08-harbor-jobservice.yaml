---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: harbor-jobservice
  namespace: harbor
  labels:
    app: harbor-jobservice
    project: linkedeye
spec:
  replicas: 1
  selector:
    matchLabels:
      app: harbor-jobservice
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: harbor-jobservice
        project: linkedeye
    spec:
      initContainers:
        - name: wait-for-core
          image: busybox:1.35
          command: ["sh", "-c", "until nc -z harbor-core-svc 8080; do sleep 3; done"]
      containers:
        - name: harbor-jobservice
          image: goharbor/harbor-jobservice:v2.10.0
          ports:
            - containerPort: 8080
          env:
            - name: CORE_SECRET
              valueFrom:
                secretKeyRef:
                  name: harbor-core-secret
                  key: CORE_SECRET
            - name: JOBSERVICE_SECRET
              valueFrom:
                secretKeyRef:
                  name: harbor-core-secret
                  key: JOBSERVICE_SECRET
            - name: CORE_URL
              value: "http://harbor-core-svc:8080"
            - name: REGISTRY_CONTROLLER_URL
              value: "http://harbor-registryctl-svc:8080"
            - name: REDIS_URL
              value: "redis://harbor-redis-svc:6379/1"
            - name: LOG_LEVEL
              value: "info"
          volumeMounts:
            - name: jobservice-data
              mountPath: /var/log/jobs
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/v1/stats
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/v1/stats
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: jobservice-data
          persistentVolumeClaim:
            claimName: harbor-jobservice-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: harbor-jobservice-svc
  namespace: harbor
  labels:
    app: harbor-jobservice
    project: linkedeye
spec:
  selector:
    app: harbor-jobservice
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
