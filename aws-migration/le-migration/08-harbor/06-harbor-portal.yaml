---
# Harbor Portal (Web UI)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: harbor-portal
  namespace: harbor
  labels:
    app: harbor-portal
    project: linkedeye
spec:
  replicas: 1
  selector:
    matchLabels:
      app: harbor-portal
  template:
    metadata:
      labels:
        app: harbor-portal
        project: linkedeye
    spec:
      containers:
        - name: harbor-portal
          image: goharbor/harbor-portal:v2.10.0
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: harbor-portal-svc
  namespace: harbor
  labels:
    app: harbor-portal
    project: linkedeye
spec:
  selector:
    app: harbor-portal
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
