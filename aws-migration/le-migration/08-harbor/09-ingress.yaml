---
# Harbor ALB Ingress
# URL: https://le-harbor.finspot.in
# TLS: GoDaddy wildcard *.finspot.in
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: harbor-ingress
  namespace: harbor
  labels:
    app: harbor
    project: linkedeye
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/certificate-source: k8s
    alb.ingress.kubernetes.io/healthcheck-path: /api/v2.0/ping
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "30"
    alb.ingress.kubernetes.io/success-codes: "200"
    alb.ingress.kubernetes.io/group.name: linkedeye-tools   # Shared ALB
    alb.ingress.kubernetes.io/tags: "Project=LinkedEye,Environment=prod"
spec:
  tls:
    - hosts:
        - le-harbor.finspot.in
      secretName: finspot-tls

  rules:
    # Web UI — routes to portal
    - host: le-harbor.finspot.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: harbor-portal-svc
                port:
                  number: 8080
          # API routes to core
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: harbor-core-svc
                port:
                  number: 8080
          - path: /service
            pathType: Prefix
            backend:
              service:
                name: harbor-core-svc
                port:
                  number: 8080
          - path: /v2
            pathType: Prefix
            backend:
              service:
                name: harbor-core-svc
                port:
                  number: 8080
          - path: /chartrepo
            pathType: Prefix
            backend:
              service:
                name: harbor-core-svc
                port:
                  number: 8080
          - path: /c
            pathType: Prefix
            backend:
              service:
                name: harbor-core-svc
                port:
                  number: 8080
