---
# Harbor Registry (stores container image blobs)
apiVersion: v1
kind: ConfigMap
metadata:
  name: harbor-registry-config
  namespace: harbor
  labels:
    app: harbor-registry
    project: linkedeye
data:
  config.yml: |
    version: 0.1
    log:
      level: info
      fields:
        service: registry
    storage:
      filesystem:
        rootdirectory: /storage
      cache:
        layerinfo: redis
      maintenance:
        uploadpurging:
          enabled: true
          age: 168h
          interval: 24h
          dryrun: false
      delete:
        enabled: true
      redirect:
        disable: false
    redis:
      addr: harbor-redis-svc:6379
      db: 2
    http:
      addr: :5000
      relativeurls: false
      debug:
        addr: :5001
    auth:
      htpasswd:
        realm: harbor-registry-basic-realm
        path: /etc/registry/passwd
    validation:
      disabled: true
    compatibility:
      schema1:
        enabled: true

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: harbor-registry
  namespace: harbor
  labels:
    app: harbor-registry
    project: linkedeye
spec:
  replicas: 1
  selector:
    matchLabels:
      app: harbor-registry
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: harbor-registry
        project: linkedeye
    spec:
      containers:
        - name: registry
          image: goharbor/registry-photon:v2.10.0
          ports:
            - containerPort: 5000
            - containerPort: 5001
          env:
            - name: REGISTRY_HTTP_SECRET
              valueFrom:
                secretKeyRef:
                  name: harbor-core-secret
                  key: CORE_SECRET
          volumeMounts:
            - name: registry-data
              mountPath: /storage
            - name: registry-config
              mountPath: /etc/registry/config.yml
              subPath: config.yml
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /
              port: 5001
            initialDelaySeconds: 30
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: 5001
            initialDelaySeconds: 10
            periodSeconds: 10
        - name: registryctl
          image: goharbor/harbor-registryctl:v2.10.0
          ports:
            - containerPort: 8080
          env:
            - name: CORE_SECRET
              valueFrom:
                secretKeyRef:
                  name: harbor-core-secret
                  key: CORE_SECRET
            - name: JOBSERVICE_SECRET
              valueFrom:
                secretKeyRef:
                  name: harbor-core-secret
                  key: JOBSERVICE_SECRET
          volumeMounts:
            - name: registry-data
              mountPath: /storage
            - name: registry-config
              mountPath: /etc/registry/config.yml
              subPath: config.yml
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: registry-data
          persistentVolumeClaim:
            claimName: harbor-registry-pvc
        - name: registry-config
          configMap:
            name: harbor-registry-config

---
apiVersion: v1
kind: Service
metadata:
  name: harbor-registry-svc
  namespace: harbor
  labels:
    app: harbor-registry
    project: linkedeye
spec:
  selector:
    app: harbor-registry
  ports:
    - name: registry
      port: 5000
      targetPort: 5000
    - name: registry-debug
      port: 5001
      targetPort: 5001
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: harbor-registryctl-svc
  namespace: harbor
  labels:
    app: harbor-registry
    project: linkedeye
spec:
  selector:
    app: harbor-registry
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
