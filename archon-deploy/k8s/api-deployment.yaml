apiVersion: apps/v1
kind: Deployment
metadata:
  name: archon-api
  namespace: archon
spec:
  replicas: 2
  selector:
    matchLabels:
      app: archon-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: archon-api
    spec:
      containers:
        - name: archon-api
          image: docker.io/library/archon-api:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: archon-secrets
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: FRONTEND_URL
              value: "https://archon.santhira.com"
            - name: ARCHON_API_URL
              value: "https://archon.santhira.com"
            - name: DB_SSL
              value: "false"
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: archon-api
  namespace: archon
spec:
  selector:
    app: archon-api
  ports:
    - port: 3000
      targetPort: 3000
