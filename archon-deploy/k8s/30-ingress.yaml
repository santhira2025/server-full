apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: archon-ingress
  namespace: archon
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  rules:
    - host: archon.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: archon-api
                port:
                  number: 80
          - path: /webhook
            pathType: Prefix
            backend:
              service:
                name: archon-api
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: archon-app
                port:
                  number: 80
