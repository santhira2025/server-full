apiVersion: v1
kind: Namespace
metadata:
  name: llm-gateway
---
apiVersion: v1
kind: Secret
metadata:
  name: llm-secrets
  namespace: llm-gateway
type: Opaque
stringData:
  litellm-master-key: "your-secure-key-here"
  openai-api-key: ""
  anthropic-api-key: ""
  groq-api-key: ""
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ollama-config
  namespace: llm-gateway
data:
  OllamaHost: "0.0.0.0:11434"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: llm-gateway
  labels:
    app: ollama
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:latest
          ports:
            - containerPort: 11434
              name: http
          envFrom:
            - configMapRef:
                name: ollama-config
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /
              port: 11434
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 11434
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: ollama-data
              mountPath: /root/.ollama
      volumes:
        - name: ollama-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: llm-gateway
spec:
  selector:
    app: ollama
  ports:
    - port: 80
      targetPort: 11434
      name: http
  type: ClusterIP
