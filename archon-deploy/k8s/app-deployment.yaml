apiVersion: apps/v1
kind: Deployment
metadata:
  name: archon-app
  namespace: archon
spec:
  replicas: 2
  selector:
    matchLabels:
      app: archon-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: archon-app
    spec:
      containers:
        - name: archon-app
          image: docker.io/library/archon-app:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: archon-app
  namespace: archon
spec:
  selector:
    app: archon-app
  ports:
    - port: 80
      targetPort: 80
