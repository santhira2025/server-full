---
# WhatsApp Agent Ingress - NGINX with TLS
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: whatsapp-agent-ingress
  namespace: whatsapp-agent
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - argus.watsapp.santhira.com
      secretName: whatsapp-agent-tls
  rules:
    - host: argus.watsapp.santhira.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: whatsapp-agent-service
                port:
                  number: 80
