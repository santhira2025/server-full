apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: budgetproperty
  labels:
    app: backend
data:
  PORT: "5000"
  NODE_ENV: "production"
  DB_HOST: "mysql.mysql.svc.cluster.local"
  DB_PORT: "3306"
  DB_NAME: "real_estate_platform"
  CLIENT_URL: "https://budgetproperty.in"
  JWT_EXPIRES_IN: "7d"
  MINIO_S3_ENDPOINT: "https://s3.budgetproperty.in"
  MINIO_ENDPOINT: "minio-api.minio-saas.svc.cluster.local"
  MINIO_PUBLIC_ENDPOINT: "https://s3.budgetproperty.in"
  MINIO_BUCKET: "property-images"
  MINIO_REGION: "us-east-1"
