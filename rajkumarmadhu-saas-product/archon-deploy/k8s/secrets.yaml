# Archon Secret manifest template
#
# IMPORTANT: Before applying to a cluster, replace every "REPLACE_ME" value
# with the actual production credential. Never commit real secrets to version
# control. You can also create the secret imperatively — see the kubectl
# command at the bottom of this file.
#
# Each key is documented inline below.
# ───────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: archon-secrets
  namespace: arugs
  labels:
    app.kubernetes.io/part-of: archon
type: Opaque
stringData:
  # ── Database ──────────────────────────────────────────────────
  # PostgreSQL connection string. If using an external DB, use its public/private IP.
  # If using an in-cluster PostgreSQL, use the service DNS name.
  # Example: postgresql://archon:password@postgres-host:5432/archon?sslmode=require
  DATABASE_URL: "REPLACE_ME"

  # ── Auth ──────────────────────────────────────────────────────
  # Strong random secret for signing JWTs. Generate with: openssl rand -hex 32
  JWT_SECRET: "REPLACE_ME"

  # ── GitHub App ────────────────────────────────────────────────
  # Numeric GitHub App ID (from GitHub App settings page)
  GITHUB_APP_ID: "REPLACE_ME"

  # GitHub App private key (full PEM content, with literal \n for newlines)
  GITHUB_APP_PRIVATE_KEY: "REPLACE_ME"

  # GitHub OAuth App client ID
  GITHUB_CLIENT_ID: "REPLACE_ME"

  # GitHub OAuth App client secret
  GITHUB_CLIENT_SECRET: "REPLACE_ME"

  # Webhook signature verification secret (set in GitHub App webhook settings)
  GITHUB_WEBHOOK_SECRET: "REPLACE_ME"

  # ── AI Providers ──────────────────────────────────────────────
  # Groq API key (primary AI provider for reviews)
  GROQ_API_KEY: "REPLACE_ME"

  # Anthropic API key (used by dispatched agents)
  ANTHROPIC_API_KEY: "REPLACE_ME"

  # ── Stripe Billing ───────────────────────────────────────────
  # Live Stripe secret key (sk_live_...)
  STRIPE_SECRET_KEY: "REPLACE_ME"

  # Stripe Price IDs (optional — auto-bootstrapped if absent, but set for deterministic config)
  STRIPE_PRICE_PRO: "REPLACE_ME"
  STRIPE_PRICE_TEAM: "REPLACE_ME"

  # Stripe webhook signing secret (whsec_...)
  STRIPE_WEBHOOK_SECRET: "REPLACE_ME"

  # ── GitHub Action ─────────────────────────────────────────────
  # GitHub Action ref used by the dispatcher (default: vediyappanm/archon-action@v1)
  ARCHON_ACTION_REF: "vediyappanm/archon-action@v1"

# ─────────────────────────────────────────────────────────────────
# Alternative: create the secret imperatively (no YAML needed):
#
# kubectl create secret generic archon-secrets -n arugs \
#   --from-literal=DATABASE_URL='postgresql://...' \
#   --from-literal=JWT_SECRET="$(openssl rand -hex 32)" \
#   --from-literal=GITHUB_APP_ID='...' \
#   --from-literal=GITHUB_APP_PRIVATE_KEY='...' \
#   --from-literal=GITHUB_CLIENT_ID='...' \
#   --from-literal=GITHUB_CLIENT_SECRET='...' \
#   --from-literal=GITHUB_WEBHOOK_SECRET='...' \
#   --from-literal=GROQ_API_KEY='...' \
#   --from-literal=ANTHROPIC_API_KEY='...' \
#   --from-literal=STRIPE_SECRET_KEY='...' \
#   --from-literal=STRIPE_PRICE_PRO='...' \
#   --from-literal=STRIPE_PRICE_TEAM='...' \
#   --from-literal=STRIPE_WEBHOOK_SECRET='...' \
#   --from-literal=ARCHON_ACTION_REF='vediyappanm/archon-action@v1'
