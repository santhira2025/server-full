<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DevOps Master Platform — Reference Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0e17; --bg2: #0f1520; --bg3: #141b2a; --bg4: #1a2235;
  --border: #1e2a3f; --border2: #2a3a55;
  --text: #c8d6e5; --text2: #8899aa; --text3: #5a6a7a;
  --accent: #00d4aa; --accent2: #00b894; --accent3: #004d3d;
  --blue: #4da6ff; --blue2: #1a73e8; --blue3: #0d3b6e;
  --purple: #a78bfa; --purple2: #7c3aed;
  --orange: #fb923c; --orange2: #ea580c;
  --red: #f87171; --red2: #dc2626;
  --yellow: #fbbf24; --yellow2: #d97706;
  --pink: #f472b6; --green: #34d399;
  --card: rgba(20,27,42,0.8); --glass: rgba(255,255,255,0.03);
  --shadow: 0 4px 24px rgba(0,0,0,0.4);
  --radius: 12px; --radius2: 8px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; overflow-x:hidden; }
::-webkit-scrollbar { width:6px; } ::-webkit-scrollbar-track { background:var(--bg2); } ::-webkit-scrollbar-thumb { background:var(--border2); border-radius:3px; }

/* Layout */
.app { display:flex; height:100vh; }
.sidebar { width:260px; background:var(--bg2); border-right:1px solid var(--border); display:flex; flex-direction:column; flex-shrink:0; overflow-y:auto; }
.main { flex:1; overflow-y:auto; padding:0; }
.logo { padding:20px 20px 16px; border-bottom:1px solid var(--border); }
.logo h1 { font-family:'JetBrains Mono',monospace; font-size:14px; color:var(--accent); letter-spacing:1px; }
.logo p { font-size:11px; color:var(--text3); margin-top:4px; }

/* Nav */
.nav { padding:12px 8px; flex:1; }
.nav-section { margin-bottom:16px; }
.nav-section-title { font-size:10px; text-transform:uppercase; letter-spacing:1.5px; color:var(--text3); padding:4px 12px 8px; font-weight:600; }
.nav-item { display:flex; align-items:center; gap:10px; padding:8px 12px; border-radius:var(--radius2); cursor:pointer; transition:all .2s; font-size:13px; color:var(--text2); }
.nav-item:hover { background:var(--glass); color:var(--text); }
.nav-item.active { background:linear-gradient(135deg,var(--accent3),rgba(0,212,170,0.1)); color:var(--accent); border:1px solid rgba(0,212,170,0.2); }
.nav-icon { width:18px; text-align:center; font-size:14px; flex-shrink:0; }
.nav-badge { margin-left:auto; font-size:10px; padding:2px 6px; border-radius:10px; background:var(--bg4); color:var(--text3); font-family:'JetBrains Mono',monospace; }

/* Header */
.page-header { padding:24px 32px 20px; border-bottom:1px solid var(--border); background:var(--bg2); position:sticky; top:0; z-index:10; backdrop-filter:blur(20px); }
.page-header h2 { font-size:20px; font-weight:700; color:var(--text); }
.page-header p { font-size:12px; color:var(--text3); margin-top:4px; }
.header-stats { display:flex; gap:24px; margin-top:12px; }
.header-stat { display:flex; align-items:baseline; gap:6px; }
.header-stat .val { font-family:'JetBrains Mono',monospace; font-size:18px; font-weight:700; }
.header-stat .label { font-size:11px; color:var(--text3); }

/* Content */
.content { padding:24px 32px; }

/* Cards Grid */
.grid { display:grid; gap:16px; }
.grid-2 { grid-template-columns: repeat(2,1fr); }
.grid-3 { grid-template-columns: repeat(3,1fr); }
.grid-4 { grid-template-columns: repeat(4,1fr); }
.grid-6 { grid-template-columns: repeat(6,1fr); }
@media(max-width:1200px) { .grid-4,.grid-6 { grid-template-columns: repeat(3,1fr); } .grid-3 { grid-template-columns: repeat(2,1fr); } }

/* Card */
.card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:20px; transition:all .3s; position:relative; overflow:hidden; }
.card:hover { border-color:var(--border2); transform:translateY(-2px); box-shadow:var(--shadow); }
.card-glow { position:absolute; top:-50%; left:-50%; width:200%; height:200%; background:radial-gradient(circle at center,rgba(0,212,170,0.03),transparent 70%); pointer-events:none; }
.card-icon { width:40px; height:40px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:18px; margin-bottom:12px; }
.card h3 { font-size:14px; font-weight:600; color:var(--text); margin-bottom:6px; }
.card .desc { font-size:12px; color:var(--text2); line-height:1.5; }
.card .metric { font-family:'JetBrains Mono',monospace; font-size:24px; font-weight:700; margin-bottom:4px; }
.card .sub { font-size:11px; color:var(--text3); }

/* Module Cards */
.module-card { cursor:pointer; }
.module-card .module-icon { font-size:28px; margin-bottom:8px; }
.module-card .module-tag { display:inline-block; font-size:10px; padding:2px 8px; border-radius:10px; font-weight:600; margin-top:8px; }

/* Tables */
.table-wrap { overflow-x:auto; border:1px solid var(--border); border-radius:var(--radius); }
table { width:100%; border-collapse:collapse; font-size:13px; }
th { background:var(--bg4); color:var(--text2); font-weight:600; text-transform:uppercase; font-size:10px; letter-spacing:1px; padding:10px 14px; text-align:left; border-bottom:1px solid var(--border); position:sticky; top:0; }
td { padding:10px 14px; border-bottom:1px solid var(--border); color:var(--text); vertical-align:top; }
tr:hover td { background:rgba(0,212,170,0.03); }
tr:last-child td { border-bottom:none; }
.cell-code { font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--blue); }
.cell-tag { display:inline-block; padding:2px 8px; border-radius:10px; font-size:10px; font-weight:600; }
.tag-green { background:rgba(0,212,170,0.15); color:var(--accent); }
.tag-blue { background:rgba(77,166,255,0.15); color:var(--blue); }
.tag-purple { background:rgba(167,139,250,0.15); color:var(--purple); }
.tag-orange { background:rgba(251,146,60,0.15); color:var(--orange); }
.tag-red { background:rgba(248,113,113,0.15); color:var(--red); }
.tag-yellow { background:rgba(251,191,36,0.15); color:var(--yellow); }
.tag-pink { background:rgba(244,114,182,0.15); color:var(--pink); }

/* Tabs */
.tabs { display:flex; gap:2px; background:var(--bg3); border-radius:var(--radius2); padding:3px; margin-bottom:20px; overflow-x:auto; flex-wrap:nowrap; }
.tab { padding:8px 16px; border-radius:6px; font-size:12px; font-weight:500; color:var(--text3); cursor:pointer; transition:all .2s; white-space:nowrap; }
.tab:hover { color:var(--text); }
.tab.active { background:var(--bg); color:var(--accent); box-shadow:0 2px 8px rgba(0,0,0,0.3); }

/* Code Block */
.code-block { background:var(--bg); border:1px solid var(--border); border-radius:var(--radius2); padding:16px; font-family:'JetBrains Mono',monospace; font-size:12px; line-height:1.7; overflow-x:auto; color:var(--text2); white-space:pre; margin:12px 0; }
.code-title { font-size:11px; color:var(--text3); text-transform:uppercase; letter-spacing:1px; margin-bottom:8px; font-weight:600; }

/* Search */
.search-box { position:relative; margin-bottom:20px; }
.search-box input { width:100%; padding:12px 16px 12px 40px; background:var(--bg3); border:1px solid var(--border); border-radius:var(--radius2); color:var(--text); font-size:13px; outline:none; font-family:'DM Sans',sans-serif; }
.search-box input:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(0,212,170,0.1); }
.search-box .search-icon { position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--text3); font-size:14px; }

/* Error Flow */
.flow-step { display:flex; gap:16px; padding:16px; background:var(--bg3); border-radius:var(--radius2); margin-bottom:8px; border-left:3px solid; }
.flow-step .step-num { font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:700; width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.flow-step .step-content h4 { font-size:13px; font-weight:600; margin-bottom:4px; }
.flow-step .step-content p { font-size:12px; color:var(--text2); line-height:1.5; }

/* Badges / Pills */
.pill { display:inline-flex; align-items:center; gap:4px; padding:4px 10px; border-radius:20px; font-size:11px; font-weight:600; }

/* Architecture Diagram */
.arch-flow { display:flex; flex-wrap:wrap; gap:12px; justify-content:center; padding:20px; }
.arch-node { padding:10px 16px; border-radius:var(--radius2); border:1px solid; font-size:11px; font-weight:600; text-align:center; min-width:100px; position:relative; }
.arch-arrow { color:var(--text3); font-size:18px; display:flex; align-items:center; }

/* Stat Bar */
.stat-bar { display:flex; align-items:center; gap:10px; margin:6px 0; }
.stat-bar-fill { height:6px; border-radius:3px; background:linear-gradient(90deg,var(--accent),var(--blue)); }
.stat-bar-track { flex:1; height:6px; border-radius:3px; background:var(--bg4); overflow:hidden; }
.stat-bar-label { font-size:11px; color:var(--text3); min-width:40px; text-align:right; font-family:'JetBrains Mono',monospace; }

/* Animation */
@keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
.animate { animation:fadeIn .4s ease forwards; }
.delay-1 { animation-delay:.05s; opacity:0; }
.delay-2 { animation-delay:.1s; opacity:0; }
.delay-3 { animation-delay:.15s; opacity:0; }
.delay-4 { animation-delay:.2s; opacity:0; }

/* Expand section */
.expand-section { margin-bottom:16px; }
.expand-header { display:flex; align-items:center; justify-content:space-between; padding:12px 16px; background:var(--bg3); border:1px solid var(--border); border-radius:var(--radius2); cursor:pointer; }
.expand-header:hover { border-color:var(--border2); }
.expand-header h4 { font-size:13px; font-weight:600; }
.expand-body { padding:16px; border:1px solid var(--border); border-top:none; border-radius:0 0 var(--radius2) var(--radius2); background:var(--bg); display:none; }
.expand-body.open { display:block; }
.chevron { transition:transform .2s; }
.chevron.open { transform:rotate(180deg); }

/* Responsive sidebar */
.sidebar-toggle { display:none; position:fixed; top:12px; left:12px; z-index:100; background:var(--bg3); border:1px solid var(--border); border-radius:8px; padding:8px 12px; color:var(--text); cursor:pointer; font-size:16px; }
@media(max-width:900px) {
  .sidebar { position:fixed; left:-260px; top:0; bottom:0; z-index:50; transition:left .3s; }
  .sidebar.open { left:0; }
  .sidebar-toggle { display:block; }
  .content { padding:24px 16px; }
  .grid-2,.grid-3,.grid-4,.grid-6 { grid-template-columns:1fr; }
}
</style>
</head>
<body>

<button class="sidebar-toggle" onclick="document.querySelector('.sidebar').classList.toggle('open')">☰</button>

<div class="app">
<!-- SIDEBAR -->
<div class="sidebar">
  <div class="logo">
    <h1>⚡ DEVOPS MASTER</h1>
    <p>Enterprise SaaS Platform v1.0</p>
  </div>
  <nav class="nav" id="nav"></nav>
  <div style="padding:16px;border-top:1px solid var(--border)">
    <div style="font-size:11px;color:var(--text3)">Santhira · Feb 2026</div>
    <div style="font-size:10px;color:var(--text3);margin-top:2px">Rajkumar Madhu, Founder & CTO</div>
  </div>
</div>

<!-- MAIN -->
<div class="main" id="main"></div>
</div>

<script>
// ======================== DATA ========================
const NAV = [
  { section:"Platform", items:[
    {id:"overview",icon:"🏠",label:"Overview",badge:""},
    {id:"architecture",icon:"🏗️",label:"Architecture",badge:"16"},
    {id:"techstack",icon:"⚙️",label:"Tech Stack",badge:""},
  ]},
  { section:"Core Modules", items:[
    {id:"learning",icon:"📚",label:"Learning Engine",badge:"15"},
    {id:"deploy",icon:"🚀",label:"Deployment Engine",badge:"100+"},
    {id:"troubleshoot",icon:"🔧",label:"Troubleshooter AI",badge:"10K+"},
    {id:"interview",icon:"🎯",label:"Interview Engine",badge:"500+"},
    {id:"analyzer",icon:"📊",label:"Log Analyzer",badge:""},
    {id:"expander",icon:"✨",label:"5-Point Expander",badge:""},
    {id:"configvault",icon:"🔐",label:"Config Vault",badge:"500+"},
  ]},
  { section:"Reference", items:[
    {id:"api",icon:"🔌",label:"API Endpoints",badge:"43"},
    {id:"errors",icon:"🐛",label:"Error Catalog",badge:"10K+"},
    {id:"coverage",icon:"📈",label:"Content Matrix",badge:""},
    {id:"roadmap",icon:"🗺️",label:"Roadmap & Revenue",badge:""},
  ]},
];

// ======================== RENDER NAV ========================
function renderNav() {
  const nav = document.getElementById('nav');
  nav.innerHTML = NAV.map(s => `
    <div class="nav-section">
      <div class="nav-section-title">${s.section}</div>
      ${s.items.map(i => `
        <div class="nav-item ${i.id==='overview'?'active':''}" data-page="${i.id}" onclick="goTo('${i.id}')">
          <span class="nav-icon">${i.icon}</span>
          <span>${i.label}</span>
          ${i.badge?`<span class="nav-badge">${i.badge}</span>`:''}
        </div>
      `).join('')}
    </div>
  `).join('');
}

function goTo(id) {
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.remove('active'));
  document.querySelector(`[data-page="${id}"]`)?.classList.add('active');
  document.querySelector('.sidebar').classList.remove('open');
  renderPage(id);
}

// ======================== PAGES ========================
const PAGES = {};

// ---------- OVERVIEW ----------
PAGES.overview = () => `
<div class="page-header">
  <h2>DevOps Master Platform</h2>
  <p>Enterprise SaaS — Learning · Deployment · Operations · Troubleshooting · Interview Prep</p>
  <div class="header-stats">
    <div class="header-stat"><span class="val" style="color:var(--accent)">517</span><span class="label">Topics</span></div>
    <div class="header-stat"><span class="val" style="color:var(--blue)">520+</span><span class="label">Configs</span></div>
    <div class="header-stat"><span class="val" style="color:var(--red)">10K+</span><span class="label">Errors</span></div>
    <div class="header-stat"><span class="val" style="color:var(--purple)">500+</span><span class="label">Interview Qs</span></div>
    <div class="header-stat"><span class="val" style="color:var(--orange)">168</span><span class="label">Labs</span></div>
    <div class="header-stat"><span class="val" style="color:var(--yellow)">8</span><span class="label">Modules</span></div>
  </div>
</div>
<div class="content">
  <div class="grid grid-4" style="margin-bottom:24px">
    ${[
      {icon:"📚",title:"Learning Engine",desc:"15 learning paths, 500+ hrs, adaptive AI, real labs",color:"var(--accent)",tag:"Core"},
      {icon:"🚀",title:"Deployment Engine",desc:"100+ tools, one-click deploy, Helm/Terraform templates",color:"var(--blue)",tag:"Core"},
      {icon:"🔧",title:"Troubleshooter AI",desc:"10,000+ errors, instant RCA, step-by-step fixes",color:"var(--red)",tag:"AI"},
      {icon:"🎯",title:"Interview Engine",desc:"500+ Q&A, mock AI interviews, scoring & feedback",color:"var(--purple)",tag:"Core"},
      {icon:"📊",title:"Log Analyzer",desc:"Upload logs → AI analysis, anomaly detection, reports",color:"var(--orange)",tag:"AI"},
      {icon:"✨",title:"5-Point Expander",desc:"5 keywords → complete docs with configs & diagrams",color:"var(--yellow)",tag:"AI"},
      {icon:"🔐",title:"Config Vault",desc:"500+ production configs, env-specific, versioned",color:"var(--green)",tag:"Core"},
      {icon:"🏗️",title:"Arch Generator",desc:"Describe → full architecture with implementation guide",color:"var(--pink)",tag:"AI"},
    ].map((m,i) => `
      <div class="card module-card animate delay-${i%4+1}" onclick="goTo('${['learning','deploy','troubleshoot','interview','analyzer','expander','configvault','architecture'][i]}')">
        <div class="card-glow"></div>
        <div class="module-icon">${m.icon}</div>
        <h3>${m.title}</h3>
        <div class="desc">${m.desc}</div>
        <span class="module-tag" style="background:${m.color}22;color:${m.color}">${m.tag}</span>
      </div>
    `).join('')}
  </div>

  <h3 style="font-size:16px;margin-bottom:16px;color:var(--text)">Platform Architecture Flow</h3>
  <div class="card" style="padding:24px">
    <div class="arch-flow">
      ${['👤 User','→','🌐 CDN/CloudFlare','→','🔀 API Gateway (Kong)','→','🔑 Auth (Keycloak)'].map(n =>
        n==='→'?'<div class="arch-arrow">→</div>':`<div class="arch-node" style="border-color:var(--accent);color:var(--accent);background:var(--accent)11">${n}</div>`
      ).join('')}
    </div>
    <div style="text-align:center;color:var(--text3);font-size:12px;margin:8px 0">↓ Routes to Microservices ↓</div>
    <div class="arch-flow">
      ${[
        {n:'📚 Learning',c:'--accent'},{n:'🚀 Deploy',c:'--blue'},{n:'🔧 Troubleshoot',c:'--red'},
        {n:'🎯 Interview',c:'--purple'},{n:'📊 Analyzer',c:'--orange'},{n:'✨ Expander',c:'--yellow'},
        {n:'🔐 Config',c:'--green'},{n:'📝 DocGen',c:'--pink'}
      ].map(s => `<div class="arch-node" style="border-color:var(${s.c});color:var(${s.c});background:var(${s.c})11">${s.n}</div>`).join('')}
    </div>
    <div style="text-align:center;color:var(--text3);font-size:12px;margin:8px 0">↓ Shared Services ↓</div>
    <div class="arch-flow">
      ${[
        {n:'🤖 AI/LLM (Ollama)',c:'--purple'},{n:'🗄️ PostgreSQL',c:'--blue'},{n:'⚡ Redis',c:'--red'},
        {n:'🔍 Elasticsearch',c:'--yellow'},{n:'📨 Kafka',c:'--orange'},{n:'📈 Prometheus',c:'--green'}
      ].map(s => `<div class="arch-node" style="border-color:var(${s.c});color:var(${s.c});background:var(${s.c})11">${s.n}</div>`).join('')}
    </div>
  </div>

  <h3 style="font-size:16px;margin:24px 0 16px;color:var(--text)">Pricing Tiers</h3>
  <div class="grid grid-4">
    ${[
      {tier:"Free",price:"$0",features:["5 topics/day","Basic troubleshooter","10 Q&A/day","Community support"],color:"var(--text3)"},
      {tier:"Pro",price:"$29/mo",features:["Unlimited access","Full troubleshooter","All interview Q&A","Labs 2hr/day","Config vault"],color:"var(--accent)"},
      {tier:"Team",price:"$19/user/mo",features:["Everything in Pro","Team dashboards","Skill assessments","Custom paths","SSO"],color:"var(--blue)"},
      {tier:"Enterprise",price:"Custom",features:["Everything","Private deploy","Custom integrations","SLA","On-prem option"],color:"var(--purple)"},
    ].map(t => `
      <div class="card">
        <div style="font-size:11px;color:${t.color};font-weight:600;text-transform:uppercase;letter-spacing:1px">${t.tier}</div>
        <div style="font-family:'JetBrains Mono',monospace;font-size:28px;font-weight:700;color:${t.color};margin:8px 0">${t.price}</div>
        ${t.features.map(f=>`<div style="font-size:12px;color:var(--text2);padding:3px 0">✓ ${f}</div>`).join('')}
      </div>
    `).join('')}
  </div>
</div>`;

// ---------- ARCHITECTURE ----------
PAGES.architecture = () => `
<div class="page-header">
  <h2>🏗️ Platform Architecture</h2>
  <p>16 microservices · Kubernetes · Event-driven · AI-powered</p>
</div>
<div class="content">
  <div class="tabs" id="arch-tabs">
    ${['Microservices','K8s Namespaces','Database Schema','Infrastructure'].map((t,i) =>
      `<div class="tab ${i===0?'active':''}" onclick="switchTab('arch',${i})">${t}</div>`
    ).join('')}
  </div>
  <div id="arch-panel-0">
    <div class="table-wrap">
    <table><thead><tr><th>Component</th><th>Technology</th><th>Purpose</th></tr></thead><tbody>
    ${[
      ['Frontend','React 18 + Next.js 14','SPA, Monaco Editor, Mermaid.js, xterm.js, WebSocket'],
      ['API Gateway','Kong / Traefik','Rate limiting, auth, routing, API versioning'],
      ['Auth Service','Keycloak','OAuth2, OIDC, SAML, SSO, RBAC, MFA, JWT'],
      ['Learning Engine','Go','Learning paths, progress tracking, spaced repetition'],
      ['Lab Provisioner','Go + k3s','Isolated per-user K8s sandboxes, TTL cleanup'],
      ['Deployment Engine','Python/FastAPI','Template rendering, Helm/TF execution, GitOps'],
      ['Troubleshoot AI','Python/LangChain + Ollama','Error parsing, RCA, knowledge graph, LLM inference'],
      ['Interview Engine','Python/FastAPI','Q&A database, mock interview AI, scoring'],
      ['Log Analyzer','Python + ES','Log ingestion, pattern detection, anomaly scoring'],
      ['Doc Generator','Python','Template engine, diagram + config rendering, export'],
      ['5-Point Expander','Python/LangChain','Topic expansion, content generation, diagrams'],
      ['Config Vault','Go','Config storage, versioning, env templating'],
      ['AI/ML Service','Python + Ollama/vLLM','LLM inference, embeddings, classification'],
      ['Search','Elasticsearch/Meilisearch','Full-text + semantic search'],
      ['Analytics','ClickHouse','User analytics, learning metrics, billing'],
      ['Notifications','Go','Email (SES), Slack, Teams, PagerDuty'],
    ].map((r,i)=>`<tr><td><strong>${r[0]}</strong></td><td><span class="cell-code">${r[1]}</span></td><td>${r[2]}</td></tr>`).join('')}
    </tbody></table>
    </div>
  </div>
  <div id="arch-panel-1" style="display:none">
    <div class="table-wrap">
    <table><thead><tr><th>Namespace</th><th>Services</th><th>Resources</th></tr></thead><tbody>
    ${[
      ['devops-platform','API Gateway, Frontend, Auth','4 pods, 2vCPU/4GB'],
      ['learning-engine','Learning API, Progress DB, Worker','3 pods, 1vCPU/2GB'],

      <div class="metric" style="color:var(--accent)">${r.val}</div>
      <h3>${r.stream}</h3>
      <div class="desc">${r.desc}</div>
    </div>
  `).join('')}
  </div>
</div>`;

// ======================== RENDER ========================
function renderPage(id) {
  const main = document.getElementById('main');
  if (PAGES[id]) {
    main.innerHTML = PAGES[id]();
    main.scrollTop = 0;
  }
}

function switchTab(prefix, idx) {
  document.querySelectorAll(`#${prefix}-tabs .tab`).forEach((t,i) => {
    t.classList.toggle('active', i===idx);
  });
  for (let i=0; i<10; i++) {
    const panel = document.getElementById(`${prefix}-panel-${i}`);
    if (panel) panel.style.display = i===idx ? 'block' : 'none';
  }
}

function filterTable(input, tableId) {
  const q = input.value.toLowerCase();
  const table = document.getElementById(tableId);
  if (!table) return;
  table.querySelectorAll('tbody tr').forEach(row => {
    row.style.display = row.textContent.toLowerCase().includes(q) ? '' : 'none';
  });
}

// Init
renderNav();
renderPage('overview');
</script>
</body>
</html>
