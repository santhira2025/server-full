<script>
// ========== INTERVIEW ENGINE ==========
PAGES.interview=function(){
  var bank=[['Linux Administration','40','Technical \u00b7 Scenario \u00b7 Troubleshoot \u00b7 Design \u00b7 Leadership'],['Networking','35','Technical \u00b7 VPC Design \u00b7 Troubleshoot \u00b7 Hybrid Architecture'],['Docker & Containers','35','Internals \u00b7 Dockerfile \u00b7 Security \u00b7 Migration \u00b7 Production'],['Kubernetes','60','Architecture \u00b7 Networking \u00b7 Security \u00b7 Helm \u00b7 GitOps \u00b7 EKS/AKS/GKE'],['Terraform & IaC','35','State \u00b7 Modules \u00b7 CI/CD \u00b7 Multi-cloud \u00b7 Policy \u00b7 Migration'],['CI/CD & DevOps','35','Pipelines \u00b7 Strategies \u00b7 GitOps \u00b7 DORA \u00b7 Git \u00b7 Platform Eng'],['AWS Cloud','50','Compute \u00b7 Storage \u00b7 DB \u00b7 Networking \u00b7 Security \u00b7 Migration \u00b7 Cost'],['Azure & GCP','30','Azure VMs/AKS \u00b7 GCP GKE/BigQuery \u00b7 Multi-cloud Strategy'],['Monitoring & Observability','30','Prometheus \u00b7 Grafana \u00b7 ELK \u00b7 Tracing \u00b7 SLO \u00b7 AIOps'],['Nginx & Web Servers','20','Config \u00b7 Reverse Proxy \u00b7 SSL \u00b7 Rate Limiting \u00b7 Ingress'],['Databases','25','PostgreSQL \u00b7 MySQL \u00b7 MongoDB \u00b7 Redis \u00b7 Replication \u00b7 DR'],['Security','25','DevSecOps \u00b7 Container Security \u00b7 Compliance \u00b7 Incident Response'],['AIOps & MLOps','25','Anomaly Detection \u00b7 ML Pipelines \u00b7 Model Serving \u00b7 LLMOps'],['Maven & Build','15','Lifecycle \u00b7 POM \u00b7 Dependencies \u00b7 Multi-module \u00b7 CI Integration'],['Leadership','40','Architecture Decisions \u00b7 System Design \u00b7 SRE Culture \u00b7 Behavioral']];
  var ansComps=[{icon:'\u26A1',t:'Quick Answer',d:'2\u20133 sentence concise response',c:'--accent'},{icon:'\u{1F4D6}',t:'Detailed Answer',d:'Full technical explanation, trade-offs, best practices',c:'--blue'},{icon:'\u{1F3ED}',t:'Real-Time Scenario',d:'Production story demonstrating the concept',c:'--orange'},{icon:'\u{1F504}',t:'Follow-Up Questions',d:'3\u20135 likely follow-ups with answers',c:'--purple'},{icon:'\u{1F5FA}\uFE0F',t:'Architecture Diagram',d:'Visual diagram of the system/concept',c:'--green'},{icon:'\u{1F4BB}',t:'Commands/Config',d:'Exact commands or configs interviewer may ask',c:'--yellow'},{icon:'\u26A0\uFE0F',t:'Common Mistakes',d:'What candidates get wrong + how to avoid',c:'--red'},{icon:'\u{1F441}\uFE0F',t:'Interviewer View',d:'What the interviewer is really testing',c:'--pink'}];
  var h=hdr('Interview Engine','\u{1F3AF} Interview Mastery Engine','500+ Q&A \u00b7 Real-time scenarios \u00b7 Mock AI interviews \u00b7 Scoring & feedback');
  h+='<div class="content"><div class="tabs" id="int-tabs">'+['Question Bank','Answer Structure','Mock Interview','Sample Q&A'].map(function(t,i){return '<div class="tab'+(i===0?' active':'')+'" onclick="switchTab(\'int\','+i+')">'+t+'</div>'}).join('')+'</div>';
  // Panel 0
  h+='<div id="int-panel-0"><div class="search-box"><span class="si">\u{1F50D}</span><input placeholder="Search questions..." oninput="filterTable(this,\'int-table\')"></div>'+tbl(['Category','Questions','Types'],bank.map(function(r){return '<tr><td><strong>'+r[0]+'</strong></td><td style="font-family:JetBrains Mono,monospace;color:var(--accent)">'+r[1]+'</td><td style="font-size:11px;color:var(--text2)">'+r[2]+'</td></tr>'}).join('')+'<tr style="background:var(--bg4)"><td><strong>TOTAL</strong></td><td style="font-family:JetBrains Mono,monospace;color:var(--accent);font-weight:700">500+</td><td></td></tr>').replace('<table','<table id="int-table"')+'</div>';
  // Panel 1
  h+='<div id="int-panel-1" style="display:none"><h3 style="font-size:15px;margin-bottom:16px">Every Answer Contains 8 Components</h3><div class="grid grid-2">';
  ansComps.forEach(function(f){h+='<div class="card"><div style="font-size:20px;margin-bottom:6px">'+f.icon+'</div><h3 style="color:var('+f.c+')">'+f.t+'</h3><div class="desc">'+f.d+'</div></div>'});
  h+='</div></div>';
  // Panel 2: Mock
  h+='<div id="int-panel-2" style="display:none"><h3 style="font-size:15px;margin-bottom:16px">AI Mock Interview Mode</h3><div class="grid grid-3">';
  [{t:'Role Selection',items:['DevOps Engineer','SRE','Cloud Architect','Platform Engineer','Security Engineer']},{t:'Experience Level',items:['Junior (0\u20133yr)','Mid (3\u20137yr)','Senior (7\u201312yr)','Staff/Principal (12+yr)']},{t:'Interview Format',items:['30-min Quick','45-min Standard','60-min Deep Dive','System Design Only']}].forEach(function(g){
    h+='<div class="card"><h3>'+g.t+'</h3>';g.items.forEach(function(i){h+='<div style="padding:4px 0;font-size:12px;color:var(--text2)">\u25B8 '+i+'</div>'});h+='</div>';
  });
  h+='</div><div class="card" style="margin-top:16px"><h3 style="margin-bottom:8px">Scoring Rubric</h3>';
  ['Technical Depth','Communication Clarity','Problem-Solving','Architecture Thinking','Leadership & Process'].forEach(function(s,i){
    h+='<div class="stat-bar" style="margin:10px 0"><div style="min-width:160px;font-size:12px">'+s+'</div><div class="stat-bar-track"><div class="stat-bar-fill" style="width:'+(85-i*5)+'%;background:linear-gradient(90deg,var(--accent),var(--blue))"></div></div><div class="stat-bar-label">'+(85-i*5)+'%</div></div>';
  });
  h+='</div></div>';
  // Panel 3: Sample
  h+='<div id="int-panel-3" style="display:none"><div class="card" style="border-left:3px solid var(--purple);margin-bottom:16px"><h3 style="color:var(--purple);margin-bottom:8px">Q: Design a zero-downtime deployment for a critical payment service on K8s</h3><div class="code-title">Quick Answer</div><p style="font-size:13px;margin-bottom:12px">Rolling update with maxSurge=1, maxUnavailable=0, combined with readiness probes, PDB, and preStop lifecycle hooks.</p><div class="code-title">Detailed Answer</div><div style="font-size:12px;color:var(--text2);line-height:1.7"><strong>1. Rolling Update:</strong> maxSurge:1 maxUnavailable:0 \u2014 never drop below current capacity<br><strong>2. Readiness Probe:</strong> HTTP /health/ready \u2014 pod only gets traffic when ready<br><strong>3. Startup Probe:</strong> failureThreshold:30 \u2014 allow 5min for JVM/heavy apps<br><strong>4. PreStop Hook:</strong> sleep 15s \u2014 drain in-flight requests before SIGTERM<br><strong>5. PDB:</strong> minAvailable:2 \u2014 prevent simultaneous pod termination<br><strong>6. Resources:</strong> requests=limits for Guaranteed QoS class<br><strong>7. Anti-Affinity:</strong> spread pods across nodes and AZs</div><div class="code-title" style="margin-top:12px">Config Snippet</div><div class="code-block">strategy:\n  type: RollingUpdate\n  rollingUpdate:\n    maxSurge: 1\n    maxUnavailable: 0\nterminationGracePeriodSeconds: 45\nlifecycle:\n  preStop:\n    exec:\n      command: [\'sh\', \'-c\', \'sleep 15\']</div><div class="code-title" style="margin-top:12px">Follow-Up Questions</div><div style="font-size:12px;color:var(--text2)">1. How handle DB migrations during deployment?<br>2. How implement automated rollback on error rate spike?<br>3. How would you do canary instead of rolling?<br>4. What metrics monitor during deployment?<br>5. How does PDB interact with Cluster Autoscaler?</div></div></div>';
  h+='</div>';return h;
};
</script>
