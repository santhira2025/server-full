<script>
// ========== LEARNING ENGINE - FULL PATH DETAILS ==========
var LEARN_DETAIL={
  'LP-001':{
    title:'Linux Fundamentals \u2192 Advanced',
    topics:['Boot Process & GRUB2','Filesystem Hierarchy (FHS)','File Permissions & ACLs','User & Group Management','Process Management (ps, top, kill)','Package Management (apt/yum/dnf)','Shell Scripting (Bash)','Networking (ip, ss, netstat, iptables)','Systemd Services & Timers','Log Management (journalctl, rsyslog)','Disk Management (LVM, fdisk, mount)','SSH Configuration & Tunneling','Security Hardening (SELinux, AppArmor)','Kernel Parameters (sysctl)','Performance Tuning (vmstat, iostat, sar)'],
    concept:'<h4 style="color:var(--accent);margin-bottom:8px">\u{1F4D6} Linux Boot Process — Beginner to Expert</h4><p style="font-size:13px;line-height:1.8;color:var(--text2)"><strong>Beginner:</strong> When you power on a Linux server, it follows: <strong>BIOS/UEFI \u2192 GRUB2 \u2192 Kernel \u2192 initramfs \u2192 systemd (PID 1) \u2192 Services</strong>.</p><p style="font-size:13px;line-height:1.8;color:var(--text2);margin-top:8px"><strong>Intermediate:</strong> GRUB2 reads /boot/grub2/grub.cfg, loads vmlinuz (kernel) + initramfs into RAM. Kernel decompresses, detects hardware, loads drivers. initramfs provides minimal root filesystem to mount the real root. systemd reads default.target and starts services in parallel using dependency graphs.</p><p style="font-size:13px;line-height:1.8;color:var(--text2);margin-top:8px"><strong>Expert:</strong> Understand UEFI Secure Boot chain (shim \u2192 MOK \u2192 GRUB \u2192 kernel signing). Know how to debug boot failures: rd.break at initramfs, systemd.unit=rescue.target, dracut for custom initramfs. Tune kernel cmdline: isolcpus for CPU pinning, transparent_hugepage=never for databases, cgroup_enable=memory for container hosts.</p><p style="font-size:13px;line-height:1.8;color:var(--text2);margin-top:8px"><strong>Analogy:</strong> Boot process = starting a factory. BIOS checks the building exists (POST), GRUB opens the right door (bootloader), kernel turns on the power grid (hardware init), systemd starts all the machines in order (services).</p>',
    config:'# /etc/systemd/system/myapp.service - Production Service Unit\n[Unit]\nDescription=Production Application Server\nAfter=network-online.target postgresql.service redis.service\nRequires=postgresql.service\nWants=redis.service\n\n[Service]\nType=notify\nUser=appuser\nGroup=appgroup\nWorkingDirectory=/opt/myapp\nEnvironmentFile=/etc/myapp/env\nExecStartPre=/opt/myapp/bin/preflight-check\nExecStart=/opt/myapp/bin/server --config /etc/myapp/config.yaml\nExecReload=/bin/kill -HUP $MAINPID\nRestart=on-failure\nRestartSec=5\nStartLimitIntervalSec=60\nStartLimitBurst=3\nLimitNOFILE=65535\nLimitNPROC=4096\nMemoryMax=2G\nCPUQuota=200%\n\n[Install]\nWantedBy=multi-user.target\n\n# /etc/sysctl.d/99-performance.conf\nvm.swappiness=10\nnet.core.somaxconn=65535\nnet.ipv4.tcp_max_syn_backlog=65535\nnet.core.netdev_max_backlog=65535\nfs.file-max=2097152\nvm.dirty_ratio=10\nvm.dirty_background_ratio=5',
    errors:[{err:'Kernel panic - not syncing: VFS: Unable to mount root fs',fix:'Boot from rescue: check /etc/fstab UUIDs match actual partitions (blkid). Regenerate initramfs: dracut -f /boot/initramfs-$(uname -r).img $(uname -r)'},{err:'Permission denied (even as root)',fix:'Check immutable attr: lsattr file. Remove: chattr -i file. Also check SELinux: getenforce, audit2why < /var/log/audit/audit.log. Restore context: restorecon -Rv /path'},{err:'SSH connection refused on port 22',fix:'systemctl status sshd, verify /etc/ssh/sshd_config (Port, ListenAddress, PermitRootLogin), check firewall: firewall-cmd --list-all, check fail2ban: fail2ban-client status sshd'},{err:'Disk full - "No space left on device"',fix:'Find large files: du -sh /* | sort -rh | head, clean journal: journalctl --vacuum-size=500M, find old kernels: package-cleanup --oldkernels, check inodes: df -i'},{err:'Zombie processes accumulating (defunct)',fix:'Find parent: ps -eo pid,ppid,stat,cmd | grep Z. Kill parent: kill -SIGCHLD <ppid>. If persistent, fix app to properly wait()/waitpid() on child processes. As last resort: kill -9 <ppid>'}],
    interview:[{q:'Explain the difference between hard links and soft links',a:'<strong>Hard link:</strong> same inode number, same data blocks, cannot cross filesystems, cannot link directories, survives original deletion (data exists until all hard links removed). <strong>Soft link:</strong> separate inode pointing to pathname, can cross filesystems, can link directories, breaks if original deleted (dangling symlink). Commands: ln file hardlink, ln -s file softlink. In production: soft links for config switching (/etc/nginx/sites-enabled -> ../sites-available/mysite), hard links rare.'},{q:'How does Linux handle OOM? How to protect critical services?',a:'OOM Killer scores every process via /proc/<pid>/oom_score (0-1000) based on: memory usage, nice value, runtime, child memory. Highest score killed first. <strong>Protection:</strong> echo -1000 > /proc/<pid>/oom_score_adj (never kill). <strong>Systemd:</strong> OOMScoreAdjust=-900 in service unit. <strong>Prevention:</strong> set MemoryMax= in cgroup, use vm.overcommit_memory=2 to prevent overcommit. Monitor: dmesg | grep -i oom, journalctl -k | grep oom.'}]
  },
  'LP-002':{
    title:'Networking & Cloud Networking',
    topics:['OSI Model & TCP/IP Stack','Subnetting & CIDR Notation','DNS Resolution Deep Dive','TCP vs UDP & Connection States','Routing & NAT (iptables/nftables)','VPC Design (AWS/Azure/GCP)','Load Balancing (L4 vs L7)','VPN & Site-to-Site Connectivity','Firewall Rules & Security Groups','Service Mesh Networking','Container Networking (CNI)','Network Troubleshooting Tools','SSL/TLS & Certificate Management','CDN & Edge Networking','BGP & Hybrid Cloud Routing'],
    concept:'<h4 style="color:var(--accent);margin-bottom:8px">\u{1F4D6} DNS Resolution — Beginner to Expert</h4><p style="font-size:13px;line-height:1.8;color:var(--text2)"><strong>Beginner:</strong> DNS translates domain names (google.com) to IP addresses (142.250.80.46). Your browser asks a DNS server "what is the IP for google.com?" and gets an answer.</p><p style="font-size:13px;line-height:1.8;color:var(--text2);margin-top:8px"><strong>Intermediate:</strong> Full resolution chain: Browser cache \u2192 OS resolver cache \u2192 /etc/hosts \u2192 Recursive resolver (ISP/8.8.8.8) \u2192 Root nameserver (.com) \u2192 TLD nameserver (google.com) \u2192 Authoritative nameserver \u2192 IP returned. Record types: A (IPv4), AAAA (IPv6), CNAME (alias), MX (mail), SRV (service discovery), TXT (verification).</p><p style="font-size:13px;line-height:1.8;color:var(--text2);margin-top:8px"><strong>Expert:</strong> Kubernetes DNS: CoreDNS resolves service-name.namespace.svc.cluster.local via kube-dns service. Pod DNS policy: ClusterFirst (use CoreDNS), Default (node resolver). Troubleshoot: nslookup, dig +trace, tcpdump port 53. AWS Route53: weighted routing (blue/green), failover (active-passive), latency-based (multi-region), geolocation. Private hosted zones for VPC-internal DNS.</p>',
    config:'# AWS VPC with Public + Private Subnets\nresource "aws_vpc" "main" {\n  cidr_block           = "10.0.0.0/16"\n  enable_dns_support   = true\n  enable_dns_hostnames = true\n}\n\nresource "aws_subnet" "public" {\n  count             = 3\n  vpc_id            = aws_vpc.main.id\n  cidr_block        = cidrsubnet("10.0.0.0/16", 8, count.index)\n  availability_zone = data.aws_availability_zones.az.names[count.index]\n  map_public_ip_on_launch = true\n}\n\nresource "aws_subnet" "private" {\n  count             = 3\n  vpc_id            = aws_vpc.main.id\n  cidr_block        = cidrsubnet("10.0.0.0/16", 8, count.index + 10)\n  availability_zone = data.aws_availability_zones.az.names[count.index]\n}\n\n# NAT Gateway for private subnet internet access\nresource "aws_nat_gateway" "nat" {\n  allocation_id = aws_eip.nat.id\n  subnet_id     = aws_subnet.public[0].id\n}',
    errors:[{err:'DNS resolution failing inside Kubernetes pods',fix:'Check CoreDNS: kubectl -n kube-system get pods -l k8s-app=kube-dns. Test from pod: kubectl exec -it <pod> -- nslookup kubernetes.default. Check /etc/resolv.conf in pod. Verify CoreDNS ConfigMap for custom domains.'},{err:'VPC peering route not working',fix:'Check: route tables in BOTH VPCs have peering routes. Security groups allow traffic. NACLs allow traffic. CIDR ranges do not overlap. DNS resolution enabled on peering connection.'},{err:'Load balancer 502 Bad Gateway',fix:'Check: target group health checks passing. Backend instances actually running on correct port. Security group allows LB \u2192 backend traffic. Application not crashing under load. Check LB access logs.'}],
    interview:[{q:'Explain the difference between L4 and L7 load balancing',a:'<strong>L4 (Transport):</strong> Routes based on IP+port only. Faster (no payload inspection). AWS NLB, HAProxy TCP mode. Use for: databases, gRPC, any TCP/UDP service. <strong>L7 (Application):</strong> Routes based on HTTP headers, URL path, cookies, host. Can do SSL termination, path-based routing, header injection. AWS ALB, Nginx, Traefik. Use for: microservices, canary deployments, A/B testing. In K8s: Ingress controllers operate at L7.'},{q:'How does a TCP three-way handshake work?',a:'Client sends SYN (seq=x) \u2192 Server responds SYN-ACK (seq=y, ack=x+1) \u2192 Client sends ACK (ack=y+1). Connection established. Teardown: FIN \u2192 ACK \u2192 FIN \u2192 ACK (four-way). TIME_WAIT state lasts 2*MSL (60s default). Too many TIME_WAIT? Tune: net.ipv4.tcp_tw_reuse=1. Monitor: ss -s, ss -tnp state time-wait.'}]
  },
  'LP-003':{
    title:'Docker & Containers Deep Dive',
    topics:['Container Internals (namespaces, cgroups)','Dockerfile Best Practices','Multi-stage Builds','Docker Networking (bridge, host, overlay)','Volume Management & Storage Drivers','Docker Compose & Multi-service Apps','Container Security & Hardening','Image Optimization & Layer Caching','Docker Registry & Harbor','Health Checks & Restart Policies','Logging Drivers & Monitoring','CI/CD with Docker','Docker in Production','Rootless Containers','BuildKit & Cache Optimization'],
    concept:'<h4 style="color:var(--accent);margin-bottom:8px">\u{1F4D6} Container Internals — Beginner to Expert</h4><p style="font-size:13px;line-height:1.8;color:var(--text2)"><strong>Beginner:</strong> Containers package your app + dependencies into an isolated, portable unit. Unlike VMs, containers share the host kernel \u2014 making them lightweight (MB vs GB) and fast to start (seconds vs minutes).</p><p style="font-size:13px;line-height:1.8;color:var(--text2);margin-top:8px"><strong>Intermediate:</strong> Containers use two Linux kernel features: <strong>Namespaces</strong> (PID, NET, MNT, UTS, IPC, USER \u2014 each provides isolation) and <strong>Cgroups</strong> (limit CPU, memory, I/O). Union filesystem (OverlayFS) layers read-only image layers + writable container layer.</p><p style="font-size:13px;line-height:1.8;color:var(--text2);margin-top:8px"><strong>Expert:</strong> Deep dive: unshare(2) syscall creates new namespaces. /proc/[pid]/ns/ shows namespace links. seccomp profiles restrict syscalls (default blocks ~44 dangerous calls). AppArmor/SELinux provide MAC. Rootless containers (userns remapping): uid 0 inside = uid 100000+ outside. OCI runtime spec defines container lifecycle. containerd \u2192 runc \u2192 container process.</p>',
    config:'# Production Dockerfile - Multi-stage, Hardened\nFROM node:20-alpine AS builder\nWORKDIR /app\nCOPY package*.json ./\nRUN npm ci --only=production && npm cache clean --force\nCOPY . .\nRUN npm run build\n\nFROM gcr.io/distroless/nodejs20-debian12 AS runtime\nCOPY --from=builder /app/dist /app/dist\nCOPY --from=builder /app/node_modules /app/node_modules\nWORKDIR /app\nUSER nonroot:nonroot\nEXPOSE 3000\nHEALTHCHECK --interval=30s --timeout=3s --retries=3 \\\n  CMD ["node", "-e", "require(\'http\').get(\'http://localhost:3000/health\',(r)=>{process.exit(r.statusCode===200?0:1)})"]\nCMD ["dist/server.js"]\n\n# docker-compose.yml - Production Stack\nservices:\n  app:\n    image: registry.santhira.dev/app:v2.1\n    deploy:\n      replicas: 3\n      resources:\n        limits: { cpus: "1.0", memory: 512M }\n    healthcheck:\n      test: wget -qO- http://localhost:3000/health\n      interval: 30s\n      retries: 3',
    errors:[{err:'Container exits immediately (exit code 0)',fix:'Ensure foreground process: CMD ["node","app.js"] not CMD node app.js. Check logs: docker logs <id>. Common: script completes and exits. Add tail -f /dev/null for debug only.'},{err:'"no space left on device" during build',fix:'docker system prune -a --volumes (removes unused images, containers, volumes). Use multi-stage builds. Add .dockerignore: node_modules, .git, *.md. Check overlay2 storage: docker system df'},{err:'Container OOMKilled repeatedly',fix:'docker inspect <id> | grep OOMKilled. Increase: docker run -m 1g. Profile app memory: docker stats. Check for memory leaks. Set --memory-reservation (soft limit) below --memory (hard limit).'}],
    interview:[{q:'Explain Docker layer caching and how to optimize build time',a:'Each Dockerfile instruction creates an immutable layer. Docker caches layers by instruction hash + build context. <strong>Optimization:</strong> 1) Order: least-changing first (COPY package.json before COPY .), 2) Combine RUN commands to reduce layers, 3) Use .dockerignore, 4) Multi-stage: build deps in stage 1, copy only artifacts to stage 2, 5) Use BuildKit cache mounts: --mount=type=cache,target=/root/.npm. Result: 10x faster rebuilds.'},{q:'What is the difference between ENTRYPOINT and CMD?',a:'<strong>CMD:</strong> default command, easily overridden by docker run args. <strong>ENTRYPOINT:</strong> always executes, CMD becomes arguments to it. Best practice: ENTRYPOINT ["python","app.py"] + CMD ["--port","8080"]. User can override port: docker run myapp --port 9090. exec form ["cmd"] preferred over shell form cmd (proper signal handling, PID 1).'}]
  },
  'LP-004':{
    title:'Kubernetes Mastery',
    topics:['K8s Architecture (control plane + nodes)','Pods, ReplicaSets, Deployments','Services (ClusterIP, NodePort, LB, ExternalName)','Ingress Controllers & TLS Termination','ConfigMaps & Secrets Management','Persistent Volumes & StorageClasses','RBAC, ServiceAccounts & Security Contexts','Helm Charts & Package Management','HPA, VPA & KEDA Autoscaling','Network Policies & Pod Security','StatefulSets, DaemonSets, Jobs','Custom Resources & Operators','GitOps (ArgoCD, Flux)','Multi-cluster & Federation','Troubleshooting K8s (debug, events, logs)'],
    concept:'<h4 style="color:var(--accent);margin-bottom:8px">\u{1F4D6} Kubernetes Architecture — Beginner to Expert</h4><p style="font-size:13px;line-height:1.8;color:var(--text2)"><strong>Beginner:</strong> Kubernetes orchestrates containers across multiple servers. You tell K8s "run 3 copies of my app" and it handles scheduling, networking, scaling, and self-healing. If a container dies, K8s automatically restarts it.</p><p style="font-size:13px;line-height:1.8;color:var(--text2);margin-top:8px"><strong>Intermediate:</strong> <em>Control Plane:</em> kube-apiserver (REST API, etcd frontend), etcd (distributed KV store \u2014 all cluster state), kube-scheduler (bin-packing pods onto nodes by resources/affinity/taints), controller-manager (reconciliation loops: deployment, replicaset, node, endpoint controllers). <em>Worker:</em> kubelet (pod lifecycle), kube-proxy (iptables/IPVS rules for services), container runtime (containerd).</p><p style="font-size:13px;line-height:1.8;color:var(--text2);margin-top:8px"><strong>Expert:</strong> API request flow: kubectl \u2192 apiserver \u2192 authentication (x509, token, OIDC) \u2192 authorization (RBAC) \u2192 admission controllers (mutating \u2192 validating \u2192 webhooks) \u2192 etcd write. Watch mechanism: controllers use informers with SharedIndexCache for efficient event processing. Leader election via lease objects. etcd: Raft consensus, 3 or 5 nodes, compaction + defrag critical for performance.</p>',
    config:'# Production Deployment with ALL best practices\napiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: payment-service\n  namespace: prod\n  labels:\n    app.kubernetes.io/name: payment-service\n    app.kubernetes.io/version: "2.1.0"\nspec:\n  replicas: 3\n  revisionHistoryLimit: 5\n  strategy:\n    type: RollingUpdate\n    rollingUpdate:\n      maxSurge: 1\n      maxUnavailable: 0\n  selector:\n    matchLabels:\n      app: payment-service\n  template:\n    spec:\n      terminationGracePeriodSeconds: 45\n      serviceAccountName: payment-sa\n      securityContext:\n        runAsNonRoot: true\n        fsGroup: 1000\n      topologySpreadConstraints:\n      - maxSkew: 1\n        topologyKey: topology.kubernetes.io/zone\n        whenUnsatisfiable: DoNotSchedule\n      containers:\n      - name: payment\n        image: registry.santhira.dev/payment:v2.1.0\n        securityContext:\n          allowPrivilegeEscalation: false\n          readOnlyRootFilesystem: true\n          capabilities: { drop: [ALL] }\n        resources:\n          requests: { cpu: 250m, memory: 256Mi }\n          limits: { cpu: 500m, memory: 512Mi }\n        readinessProbe:\n          httpGet: { path: /health/ready, port: 8080 }\n          initialDelaySeconds: 5\n          periodSeconds: 10\n        startupProbe:\n          httpGet: { path: /health/live, port: 8080 }\n          failureThreshold: 30\n          periodSeconds: 10\n        lifecycle:\n          preStop:\n            exec:\n              command: ["sh","-c","sleep 15"]',
    errors:[{err:'Pod stuck in Pending state',fix:'kubectl describe pod <name> \u2192 Events section. Causes: Insufficient resources (scale cluster or reduce requests), unschedulable (check taints: kubectl get nodes -o json | jq ".items[].spec.taints"), PVC not bound (check StorageClass, PV availability).'},{err:'CrashLoopBackOff',fix:'kubectl logs <pod> --previous (see crash logs). Top causes: 1) App exception (fix code), 2) OOMKilled (kubectl describe pod | grep OOM, increase memory), 3) Liveness probe too aggressive (add startupProbe), 4) Missing ConfigMap/Secret (kubectl get cm,secret -n <ns>).'},{err:'Service has no endpoints',fix:'kubectl get endpoints <svc> \u2014 if empty: label selector mismatch. Compare: kubectl get svc <svc> -o yaml (selector) vs kubectl get pods --show-labels. Also check: pods must be Ready (readinessProbe passing).'}],
    interview:[{q:'How does a Service route traffic to Pods?',a:'Service uses label selectors to match Pods. Endpoint controller watches for matching ready Pods and populates Endpoints object. kube-proxy programs iptables/IPVS rules on every node. <strong>ClusterIP:</strong> virtual IP, cluster-internal. <strong>NodePort:</strong> every node opens a port (30000-32767). <strong>LoadBalancer:</strong> cloud LB \u2192 NodePorts. Traffic: Client \u2192 Service VIP \u2192 iptables DNAT \u2192 random Pod IP. Session affinity via sessionAffinity: ClientIP.'},{q:'Deployment vs StatefulSet vs DaemonSet?',a:'<strong>Deployment:</strong> stateless apps, pods interchangeable (web servers, APIs), rolling updates, scales to N replicas. <strong>StatefulSet:</strong> stateful apps (databases, Kafka), stable identity (pod-0, pod-1), ordered create/delete, per-pod PVC (data survives rescheduling). <strong>DaemonSet:</strong> one pod per node (monitoring agents, log collectors, CNI plugins), auto-adds to new nodes, tolerates taints.'}]
  }
};
</script>
