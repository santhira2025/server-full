<script>
// LP-011 to LP-015
LEARN_DETAIL['LP-011']={
  title:'Security & DevSecOps',
  topics:['OWASP Top 10 & Web Security','SAST/DAST/SCA Scanning','Container Security (Trivy, Falco, Sysdig)','IaC Security Scanning (Checkov, tfsec)','Secrets Management (Vault, External Secrets)','Supply Chain Security (SBOM, Sigstore)','Network Security (WAF, DDoS, mTLS)','Compliance Frameworks (SOC2, ISO27001, GDPR)','Incident Response & Forensics','Zero Trust Architecture','Identity & Access (OIDC, SAML, RBAC)','Kubernetes Security (PSS, OPA, Kyverno)','CI/CD Pipeline Security','Penetration Testing Basics','Security Monitoring & SIEM'],
  concept:'<h4 style="color:var(--accent);margin-bottom:8px">\u{1F4D6} DevSecOps Pipeline \u2014 Beginner to Expert</h4><p style="font-size:13px;line-height:1.8;color:var(--text2)"><strong>Beginner:</strong> DevSecOps = integrating security into every stage of development, not bolting it on at the end. "Shift Left" means finding vulnerabilities early (in code/build) rather than late (in production). Every commit should trigger automated security checks.</p><p style="font-size:13px;line-height:1.8;color:var(--text2);margin-top:8px"><strong>Intermediate:</strong> Pipeline security stages: <strong>Pre-commit:</strong> detect-secrets, gitleaks (prevent credential leaks). <strong>Build:</strong> SAST (Semgrep, SonarQube \u2014 analyze source code), SCA (Snyk, Dependabot \u2014 check dependencies for CVEs). <strong>Package:</strong> Container scan (Trivy \u2014 scan images for OS/library CVEs), SBOM generation (Syft). <strong>Deploy:</strong> IaC scan (Checkov, tfsec \u2014 detect misconfigs), admission control (OPA/Kyverno \u2014 enforce policies). <strong>Runtime:</strong> Falco (syscall monitoring), runtime scanning, WAF.</p><p style="font-size:13px;line-height:1.8;color:var(--text2);margin-top:8px"><strong>Expert:</strong> Supply chain security: Sign images with Cosign (Sigstore), verify signatures in admission controller. SLSA framework levels (1-4) for build provenance. Zero Trust: assume breach, verify every request \u2014 mTLS between all services (Istio), SPIFFE/SPIRE for workload identity, no network-level trust. Compliance as Code: OPA/Rego policies mapping to SOC2 controls, automated evidence collection, continuous compliance monitoring. Threat modeling: STRIDE methodology, attack trees for each microservice.</p>',
  config:'# Trivy Scanner in CI/CD\n- name: Container Security Scan\n  uses: aquasecurity/trivy-action@master\n  with:\n    image-ref: ${{ env.REGISTRY }}/app:${{ github.sha }}\n    format: sarif\n    output: trivy-results.sarif\n    severity: CRITICAL,HIGH\n    exit-code: 1  # Fail pipeline on CRITICAL/HIGH\n\n# OPA Gatekeeper - Require Resource Limits\napiVersion: constraints.gatekeeper.sh/v1beta1\nkind: K8sRequiredResources\nmetadata:\n  name: require-resource-limits\nspec:\n  match:\n    kinds: [{ apiGroups: ["apps"], kinds: ["Deployment"] }]\n    namespaces: ["prod", "staging"]\n  parameters:\n    requiredResources: ["limits.cpu", "limits.memory"]\n\n# Falco Runtime Security Rule\n- rule: Terminal shell in container\n  desc: Detect shell opened in container\n  condition: >\n    spawned_process and container and\n    proc.name in (bash, sh, zsh) and\n    not proc.pname in (cron, supervisord)\n  output: "Shell spawned in container (user=%user.name container=%container.name)"\n  priority: WARNING',
  errors:[{err:'Trivy found CRITICAL CVE in base image',fix:'Update base image: FROM node:20.11-alpine (patch version). Check CVE details: trivy image --severity CRITICAL <image>. If no fix available: add to .trivyignore with expiry date and risk acceptance. Use distroless images where possible.'},{err:'OPA admission webhook rejecting all deployments',fix:'Check constraint: kubectl get constraints. Verify match scope is correct (not blocking system namespaces). Test policy: conftest test deployment.yaml. Check webhook logs: kubectl -n gatekeeper-system logs deploy/gatekeeper-controller.'},{err:'Secrets detected in git commit history',fix:'Never force-push to rewrite history (secrets already compromised). Rotate ALL exposed secrets immediately. Use git-filter-repo to remove from history. Add pre-commit hooks: detect-secrets, gitleaks. Use Vault/External Secrets Operator for secret injection.'},{err:'mTLS certificate errors between services',fix:'Check cert expiry: openssl x509 -enddate -noout -in cert.pem. Verify CA chain: istioctl proxy-config secret <pod>. Check cert-manager: kubectl get certificates, kubectl describe certificaterequest. Ensure STRICT PeerAuthentication policy matches all namespaces.'}],
  interview:[{q:'Explain the difference between SAST, DAST, and SCA',a:'<strong>SAST (Static Application Security Testing):</strong> Analyzes source code without running it. Finds: SQL injection, XSS, hardcoded secrets. Tools: Semgrep, SonarQube, CodeQL. Fast, integrates in IDE/CI. Con: false positives, cannot find runtime issues. <strong>DAST (Dynamic Application Security Testing):</strong> Tests running application by sending requests. Finds: auth bypass, SSRF, real exploitable vulns. Tools: OWASP ZAP, Burp Suite. Pro: fewer false positives. Con: slow, needs running app. <strong>SCA (Software Composition Analysis):</strong> Scans dependencies for known CVEs. Tools: Snyk, Dependabot, Trivy. Checks: package.json, requirements.txt, go.sum against CVE databases. Critical for supply chain security.'},{q:'How do you implement Zero Trust in a Kubernetes environment?',a:'<strong>Network:</strong> Default-deny NetworkPolicies, mTLS everywhere (Istio STRICT mode), no pod-to-pod trust. <strong>Identity:</strong> SPIFFE/SPIRE for workload identity, IRSA for AWS access (not node-level IAM). <strong>Access:</strong> RBAC with least privilege, no cluster-admin for humans, audit logging enabled. <strong>Data:</strong> Encrypt at rest (KMS), encrypt in transit (mTLS). <strong>Admission:</strong> OPA/Kyverno policies enforcing: no privileged containers, no hostPath, read-only rootfs, resource limits. <strong>Runtime:</strong> Falco for anomaly detection, immutable containers (no exec allowed in prod).'}]
};

LEARN_DETAIL['LP-012']={
  title:'Databases for DevOps',
  topics:['PostgreSQL Administration & Tuning','MySQL/MariaDB Operations','MongoDB Replication & Sharding','Redis Data Structures & Clustering','Elasticsearch & OpenSearch','Database Replication (sync/async)','Backup & Point-in-Time Recovery','Connection Pooling (PgBouncer, ProxySQL)','Database Migrations (Flyway, Alembic)','High Availability (Patroni, Galera, Sentinel)','Query Optimization & EXPLAIN','Database Monitoring & Alerting','Disaster Recovery & Failover','Database Security & Encryption','Cloud Managed Databases (RDS, Cloud SQL)'],
  concept:'<h4 style="color:var(--accent);margin-bottom:8px">\u{1F4D6} Database Replication \u2014 Beginner to Expert</h4><p style="font-size:13px;line-height:1.8;color:var(--text2)"><strong>Beginner:</strong> Replication = keeping copies of your database on multiple servers. If the primary server fails, a replica takes over (high availability). Replicas also handle read queries, distributing load (read scaling).</p><p style="font-size:13px;line-height:1.8;color:var(--text2);margin-top:8px"><strong>Intermediate:</strong> <strong>Synchronous replication:</strong> Primary waits for replica to confirm write before acknowledging client. Guarantees zero data loss but adds latency. Used for: financial data, critical records. <strong>Asynchronous replication:</strong> Primary acknowledges immediately, sends changes to replica in background. Faster but risk of data loss if primary crashes before replica catches up (replication lag). <strong>Semi-synchronous:</strong> Wait for at least one replica (best balance).</p><p style="font-size:13px;line-height:1.8;color:var(--text2);margin-top:8px"><strong>Expert:</strong> PostgreSQL: streaming replication (WAL shipping), logical replication (table-level, allows different schemas). Patroni for HA: etcd stores leader election, auto-failover in &lt;30s, pg_rewind for rejoining old primary. Connection pooling critical: PgBouncer in transaction mode (6000 app connections \u2192 100 DB connections). Query optimization: EXPLAIN ANALYZE, pg_stat_statements for slow query tracking, proper indexing (B-tree, GIN, GiST, BRIN). Vacuum tuning: autovacuum_max_workers, autovacuum_vacuum_cost_delay.</p>',
  config:'# PostgreSQL HA with Patroni (Helm values)\npatroni:\n  replication:\n    type: synchronous\n    synchronous_node_count: 1\n  postgresql:\n    parameters:\n      max_connections: 200\n      shared_buffers: 4GB         # 25% of RAM\n      effective_cache_size: 12GB  # 75% of RAM\n      work_mem: 64MB\n      maintenance_work_mem: 512MB\n      wal_buffers: 64MB\n      checkpoint_timeout: 15min\n      max_wal_size: 4GB\n      random_page_cost: 1.1       # SSD\n      effective_io_concurrency: 200\n      autovacuum_max_workers: 4\n      log_min_duration_statement: 1000  # Log slow queries >1s\n\n# PgBouncer Connection Pooler\npgbouncer:\n  pool_mode: transaction\n  default_pool_size: 25\n  max_client_conn: 5000\n  max_db_connections: 100\n\n# Backup with pgBackRest\nbackup:\n  schedule: "0 2 * * *"  # Daily at 2 AM\n  retention_full: 7\n  retention_diff: 30\n  storage: s3\n  s3_bucket: santhira-db-backups\n  encryption: true',
  errors:[{err:'PostgreSQL: "too many connections" / connection exhaustion',fix:'Check: SELECT count(*) FROM pg_stat_activity; Show state: SELECT state, count(*) FROM pg_stat_activity GROUP BY state; Deploy PgBouncer (pool_mode=transaction). Kill idle: SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE state=\'idle\' AND query_start < now()-interval \'1 hour\';'},{err:'Replication lag growing continuously',fix:'Check: SELECT pg_wal_lsn_diff(pg_current_wal_lsn(), replay_lsn) FROM pg_stat_replication; Causes: replica hardware slower, heavy writes, network bandwidth. Fix: increase wal_sender_timeout, check max_wal_senders, consider async replication for non-critical replicas.'},{err:'Redis: "OOM command not allowed when used memory > maxmemory"',fix:'Check: redis-cli info memory. Set eviction policy: CONFIG SET maxmemory-policy allkeys-lru. Increase maxmemory. Monitor key sizes: redis-cli --bigkeys. Check for missing TTLs on cache keys. Consider Redis Cluster for horizontal scaling.'}],
  interview:[{q:'When would you choose PostgreSQL vs MongoDB vs Redis?',a:'<strong>PostgreSQL:</strong> Complex queries, transactions, ACID compliance, relational data, JSON support (JSONB), full-text search, geospatial (PostGIS). Use for: user data, orders, financial records. <strong>MongoDB:</strong> Flexible schema, document-oriented, horizontal scaling (sharding), rapid prototyping. Use for: product catalogs, content management, IoT data. <strong>Redis:</strong> In-memory, sub-millisecond latency, data structures (sorted sets, streams, pub/sub). Use for: caching, sessions, rate limiting, real-time leaderboards, message queues. <strong>In practice:</strong> Most production systems use PostgreSQL as primary + Redis for caching.'},{q:'Explain database connection pooling and why it matters',a:'Problem: each DB connection = ~10MB RAM + fork overhead. 1000 app instances \u00d7 10 connections = 10,000 connections (DB crashes). <strong>Connection pooler</strong> (PgBouncer, ProxySQL) sits between app and DB. Modes: <strong>Session:</strong> 1:1 mapping (least efficient), <strong>Transaction:</strong> connection returned to pool after each transaction (best for web apps, 50:1 reduction), <strong>Statement:</strong> most aggressive (breaks multi-statement transactions). Production setup: app \u2192 PgBouncer (5000 client conn) \u2192 PostgreSQL (100 actual conn). Monitor: pgbouncer SHOW POOLS, SHOW STATS.'}]
};

LEARN_DETAIL['LP-013']={
  title:'Nginx & Web Servers',
  topics:['Nginx Architecture (master/worker model)','Server Blocks & Virtual Hosts','Reverse Proxy Configuration','Load Balancing (round-robin, least_conn, ip_hash)','SSL/TLS Termination & HSTS','HTTP/2 & HTTP/3 Configuration','Caching (proxy_cache, fastcgi_cache)','Rate Limiting & Connection Limiting','WebSocket Proxying','Security Headers & Hardening','Logging & Access Control','Performance Tuning (worker_connections, buffers)','Nginx as Kubernetes Ingress Controller','Lua/OpenResty for Dynamic Config','Monitoring (stub_status, Prometheus exporter)'],
  concept:'<h4 style="color:var(--accent);margin-bottom:8px">\u{1F4D6} Nginx Architecture \u2014 Beginner to Expert</h4><p style="font-size:13px;line-height:1.8;color:var(--text2)"><strong>Beginner:</strong> Nginx is a web server that can also act as a reverse proxy and load balancer. It sits in front of your application servers, handling client connections and forwarding requests to your backend. Think of it as a receptionist routing visitors to the right office.</p><p style="font-size:13px;line-height:1.8;color:var(--text2);margin-top:8px"><strong>Intermediate:</strong> Nginx uses an <strong>event-driven, asynchronous architecture</strong>. One master process manages multiple worker processes. Each worker handles thousands of connections using epoll/kqueue (not one-thread-per-connection like Apache prefork). This is why Nginx excels at high concurrency with low memory usage. Configuration: server blocks (virtual hosts) \u2192 location blocks (URL matching) \u2192 directives (proxy_pass, root, try_files).</p><p style="font-size:13px;line-height:1.8;color:var(--text2);margin-top:8px"><strong>Expert:</strong> Worker count = CPU cores (worker_processes auto). Each worker: worker_connections 10240 (max simultaneous connections). Connection processing phases: accept \u2192 read request \u2192 process (rewrite, access, content) \u2192 proxy upstream \u2192 send response \u2192 log. Upstream keepalive (keepalive 32) to avoid TCP handshake per request to backend. Proxy buffering: proxy_buffers 8 16k for large responses. Shared memory zones for rate limiting (limit_req_zone) and caching (proxy_cache_path). In Kubernetes: Ingress-Nginx controller watches Ingress resources and generates nginx.conf dynamically.</p>',
  config:'# /etc/nginx/conf.d/app.conf - Production Config\nupstream app_backend {\n    least_conn;\n    server 10.0.1.10:8080 weight=5;\n    server 10.0.1.11:8080 weight=5;\n    server 10.0.1.12:8080 backup;\n    keepalive 32;\n}\n\nserver {\n    listen 443 ssl http2;\n    server_name app.santhira.dev;\n\n    # TLS\n    ssl_certificate     /etc/nginx/ssl/fullchain.pem;\n    ssl_certificate_key /etc/nginx/ssl/privkey.pem;\n    ssl_protocols       TLSv1.2 TLSv1.3;\n    ssl_ciphers         HIGH:!aNULL:!MD5;\n    ssl_session_cache   shared:SSL:10m;\n    ssl_session_timeout 1d;\n    ssl_stapling on;\n    ssl_stapling_verify on;\n\n    # Security Headers\n    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;\n    add_header X-Content-Type-Options nosniff;\n    add_header X-Frame-Options DENY;\n    add_header X-XSS-Protection "1; mode=block";\n\n    # Rate Limiting\n    limit_req zone=api burst=20 nodelay;\n    limit_conn addr 100;\n\n    # Caching\n    proxy_cache app_cache;\n    proxy_cache_valid 200 10m;\n    proxy_cache_use_stale error timeout updating;\n\n    location / {\n        proxy_pass http://app_backend;\n        proxy_set_header Host $host;\n        proxy_set_header X-Real-IP $remote_addr;\n        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n        proxy_set_header X-Forwarded-Proto $scheme;\n        proxy_http_version 1.1;\n        proxy_set_header Connection "";\n    }\n\n    location /ws {\n        proxy_pass http://app_backend;\n        proxy_http_version 1.1;\n        proxy_set_header Upgrade $http_upgrade;\n        proxy_set_header Connection "upgrade";\n    }\n}',
  errors:[{err:'Nginx 502 Bad Gateway',fix:'Backend is down or unreachable. Check: curl backend:8080/health from Nginx host. Verify upstream block has correct IPs/ports. Check: nginx error.log for "connect() failed". Common: app crashed, wrong port, firewall blocking. Fix: restart backend, verify security groups.'},{err:'Nginx 504 Gateway Timeout',fix:'Backend too slow. Increase: proxy_read_timeout 300s (default 60s). Check backend performance. Add proxy_buffering on for large responses. Consider: async processing + webhook callbacks for long operations.'},{err:'SSL certificate errors / mixed content',fix:'Check cert chain: openssl s_client -connect app.santhira.dev:443 -servername app.santhira.dev. Verify cert matches domain. Ensure full chain (cert + intermediate) in ssl_certificate. Force HTTPS: return 301 https://$host$request_uri in port 80 server block. Fix mixed content: Content-Security-Policy: upgrade-insecure-requests.'}],
  interview:[{q:'Explain the difference between Nginx reverse proxy and load balancer',a:'<strong>Reverse Proxy:</strong> Nginx accepts client requests and forwards to backend. Client only sees Nginx IP. Benefits: SSL termination, caching, compression, security (hide backend). Config: proxy_pass http://backend. <strong>Load Balancer:</strong> Distributes requests across multiple backends. Algorithms: round-robin (default), least_conn (least active connections), ip_hash (session stickiness), random with_two_choices. Health checks: passive (detect failed requests) or active (periodic probes). In production: Nginx does BOTH \u2014 reverse proxy with upstream block containing multiple servers = load balancing.'},{q:'How do you handle WebSocket connections through Nginx?',a:'WebSocket requires HTTP Upgrade mechanism. Config: proxy_http_version 1.1 (WebSocket needs HTTP/1.1), proxy_set_header Upgrade $http_upgrade, proxy_set_header Connection "upgrade". Key issues: default proxy_read_timeout (60s) will close idle WebSocket connections \u2014 increase to 3600s or implement ping/pong. Nginx Plus has active health checks for WebSocket upstreams. With Ingress-Nginx: annotations nginx.ingress.kubernetes.io/proxy-read-timeout: "3600", enable-websocket: "true".'}]
};

LEARN_DETAIL['LP-014']={
  title:'AIOps & MLOps',
  topics:['AIOps Fundamentals & Use Cases','Anomaly Detection (statistical, ML-based)','Log Analysis with NLP & LLMs','Automated Root Cause Analysis','Predictive Scaling & Capacity Planning','MLOps Pipeline Architecture','Model Training & Experiment Tracking (MLflow)','Model Serving (KServe, Seldon, Triton)','Feature Stores & Data Pipelines','LLMOps (Ollama, vLLM, fine-tuning)','Model Monitoring & Drift Detection','Kubeflow & ML Kubernetes Integration','A/B Testing for ML Models','GPU Infrastructure Management','Responsible AI & Model Governance'],
  concept:'<h4 style="color:var(--accent);margin-bottom:8px">\u{1F4D6} AIOps & MLOps \u2014 Beginner to Expert</h4><p style="font-size:13px;line-height:1.8;color:var(--text2)"><strong>Beginner:</strong> <strong>AIOps</strong> = using AI/ML to improve IT operations. Instead of humans watching dashboards 24/7, AI detects anomalies, correlates alerts, and suggests root causes. <strong>MLOps</strong> = DevOps for machine learning \u2014 automating the ML lifecycle from data prep to model deployment to monitoring.</p><p style="font-size:13px;line-height:1.8;color:var(--text2);margin-top:8px"><strong>Intermediate:</strong> <strong>AIOps pipeline:</strong> Collect (metrics, logs, traces) \u2192 Normalize \u2192 Detect anomalies (statistical: z-score, IQR; ML: isolation forest, autoencoders) \u2192 Correlate (group related alerts, reduce noise by 90%+) \u2192 Root cause analysis (dependency graph + causal inference) \u2192 Auto-remediate (runbooks, self-healing). <strong>MLOps pipeline:</strong> Data versioning (DVC) \u2192 Feature engineering (feature store) \u2192 Training (distributed, GPU) \u2192 Experiment tracking (MLflow) \u2192 Model registry \u2192 Deployment (canary) \u2192 Monitoring (data drift, model accuracy).</p><p style="font-size:13px;line-height:1.8;color:var(--text2);margin-top:8px"><strong>Expert:</strong> LLMOps emerging patterns: RAG (Retrieval-Augmented Generation) for context-aware responses, fine-tuning on domain data (LoRA for parameter-efficient tuning), prompt management and versioning, guardrails for safe output, cost optimization (model routing: simple queries \u2192 small model, complex \u2192 large model). Infrastructure: vLLM for high-throughput serving (PagedAttention for efficient GPU memory), Ollama for local development, KServe for K8s-native model serving with autoscaling (scale-to-zero). Model observability: track token usage, latency percentiles, hallucination rates, user feedback loops.</p>',
  config:'# MLflow Experiment Tracking\nimport mlflow\n\nmlflow.set_tracking_uri("http://mlflow.santhira.dev")\nmlflow.set_experiment("anomaly-detection-v2")\n\nwith mlflow.start_run():\n    mlflow.log_params({\n        "model": "isolation_forest",\n        "n_estimators": 200,\n        "contamination": 0.05,\n        "features": ["cpu_usage", "memory_usage", "request_rate", "error_rate"]\n    })\n    model.fit(X_train)\n    mlflow.log_metrics({\n        "precision": 0.94,\n        "recall": 0.87,\n        "f1_score": 0.90,\n        "false_positive_rate": 0.03\n    })\n    mlflow.sklearn.log_model(model, "anomaly_detector")\n\n# KServe InferenceService\napiVersion: serving.kserve.io/v1beta1\nkind: InferenceService\nmetadata:\n  name: anomaly-detector\nspec:\n  predictor:\n    model:\n      modelFormat: { name: mlflow }\n      storageUri: s3://santhira-models/anomaly-detector/v2\n      resources:\n        limits: { nvidia.com/gpu: 1, memory: 8Gi }\n    minReplicas: 1\n    maxReplicas: 5\n    scaleTarget: 10  # Scale at 10 concurrent requests',
  errors:[{err:'Model serving latency spikes during peak traffic',fix:'Check GPU utilization: nvidia-smi. Enable request batching in KServe (batchSize, maxLatency). Scale replicas: HPA on custom metric (inference_requests_total). Use vLLM continuous batching for LLMs. Pre-warm models: set minReplicas > 0.'},{err:'Model accuracy degrading in production (data drift)',fix:'Detect: compare input feature distributions (KL divergence, PSI) against training data. Monitor: Evidently AI or custom Prometheus metrics. Retrain trigger: when drift score > threshold. Maintain shadow mode: new model serves alongside old, compare outputs before promoting.'},{err:'OOM on GPU during inference',fix:'Check model size vs GPU memory: nvidia-smi. Solutions: quantize model (INT8, FP16 \u2014 50% memory reduction), use vLLM PagedAttention (efficient KV cache), batch size reduction, model sharding across GPUs (tensor parallelism). For LLMs: GGUF quantization via Ollama.'}],
  interview:[{q:'How does RAG (Retrieval-Augmented Generation) work?',a:'<strong>Architecture:</strong> User query \u2192 Embed query (same embedding model used for documents) \u2192 Vector search in database (pgvector, Pinecone, Weaviate) \u2192 Retrieve top-K relevant chunks \u2192 Construct prompt: "Given this context: [chunks], answer: [query]" \u2192 LLM generates grounded response. <strong>Benefits:</strong> No fine-tuning needed, up-to-date knowledge, source attribution, lower hallucination. <strong>Optimization:</strong> Chunk size matters (512-1024 tokens), hybrid search (vector + keyword), reranking retrieved chunks (cross-encoder), metadata filtering.'},{q:'Explain the difference between model training and inference, and their infrastructure needs',a:'<strong>Training:</strong> Learning patterns from data. Needs: large GPU clusters (A100/H100), high memory (80GB+), fast storage (NVMe), distributed training (DeepSpeed, FSDP). Runs hours/days, batch workload, cost: $10K+ per training run. <strong>Inference:</strong> Using trained model to make predictions. Needs: lower GPU (T4, L4, or even CPU for small models), low latency (&lt;100ms), high throughput, autoscaling. Runs 24/7, real-time workload. <strong>Key difference:</strong> Training optimizes for throughput (samples/sec), inference optimizes for latency (ms/request). Different GPU types: training = A100/H100, inference = T4/L4/A10G.'}]
};

LEARN_DETAIL['LP-015']={
  title:'Interview Preparation',
  topics:['DevOps Fundamentals & Culture','Linux & System Administration Q&A','Networking & Cloud Networking Q&A','Docker & Containers Q&A','Kubernetes In-Depth Q&A','Terraform & IaC Q&A','CI/CD Pipeline Design Q&A','AWS/Azure/GCP Scenario Questions','Monitoring & Observability Q&A','Security & DevSecOps Q&A','System Design for DevOps','Troubleshooting Scenarios','Behavioral & Leadership Questions','Salary Negotiation & Career Growth','Mock Interview Practice'],
  concept:'<h4 style="color:var(--accent);margin-bottom:8px">\u{1F4D6} DevOps Interview Strategy \u2014 Beginner to Expert</h4><p style="font-size:13px;line-height:1.8;color:var(--text2)"><strong>Beginner (Junior DevOps):</strong> Focus on fundamentals: Linux commands (file operations, permissions, process management), basic networking (TCP/IP, DNS, HTTP), Docker basics (build, run, compose), Git workflows, CI/CD concepts. Be honest about what you know. Show willingness to learn. Practice explaining concepts simply \u2014 if you cannot explain it simply, you do not understand it well enough.</p><p style="font-size:13px;line-height:1.8;color:var(--text2);margin-top:8px"><strong>Intermediate (Mid-Level):</strong> Expected: Kubernetes (deployments, services, troubleshooting), Terraform (state, modules, workspaces), CI/CD pipeline design (GitHub Actions, GitLab CI), cloud services (at least one cloud deeply), monitoring setup (Prometheus, Grafana, alerting). Interview pattern: <strong>STAR method</strong> (Situation, Task, Action, Result) for behavioral. <strong>Think aloud</strong> for technical \u2014 interviewers value your problem-solving process more than perfect answers.</p><p style="font-size:13px;line-height:1.8;color:var(--text2);margin-top:8px"><strong>Expert (Senior/Staff/Principal):</strong> System design rounds: design a deployment pipeline for 500 microservices, design a multi-region DR strategy, design an observability platform. Expect: trade-off discussions (consistency vs availability, cost vs performance), organizational impact (how to adopt GitOps across 50 teams), incident management leadership, architecture decision records. Prepare 3-5 detailed stories of complex problems you solved with measurable impact (reduced deploy time by 80%, reduced incidents by 60%, saved $500K/year in cloud costs).</p>',
  config:'# Interview Preparation Checklist\n\n## Technical Preparation\n1. Linux: Practice top 50 commands, write 3 bash scripts\n2. Networking: Explain DNS resolution, TCP handshake, TLS\n3. Docker: Build multi-stage Dockerfile from scratch\n4. Kubernetes: Deploy app with Deployment + Service + Ingress\n5. Terraform: Write VPC module from scratch\n6. CI/CD: Design pipeline for containerized microservice\n7. Cloud: Deep dive into one cloud (compute, network, storage, IAM)\n8. Monitoring: Set up Prometheus + Grafana + alerting rules\n\n## System Design Template\n1. Clarify requirements (functional + non-functional)\n2. Estimate scale (users, requests/sec, data volume)\n3. High-level architecture (draw diagram)\n4. Deep dive into components (justify choices)\n5. Address: reliability, scalability, security, monitoring\n6. Discuss trade-offs and alternatives\n\n## Behavioral Preparation (STAR Method)\n- "Tell me about a production incident you handled"\n- "Describe a time you improved a process significantly"\n- "How do you handle disagreements on technical decisions?"\n- "Tell me about a project that failed and what you learned"',
  errors:[{err:'Freezing up during technical questions',fix:'Practice: explain concepts out loud to yourself or rubber duck. Use the "I know / I think / I would investigate" framework. Start with what you know confidently, then explore. Silence is worse than thinking aloud. Ask clarifying questions to buy time and show engagement.'},{err:'Failing system design interviews',fix:'Follow structured approach: Requirements \u2192 Scale estimation \u2192 High-level design \u2192 Deep dive \u2192 Trade-offs. Practice: draw architecture diagrams on whiteboard weekly. Study real systems: how Netflix handles deployments, how Google does SRE, how AWS designs for failure. Read: System Design Interview by Alex Xu.'},{err:'Getting lowballed on salary offers',fix:'Research market rates: levels.fyi, Glassdoor, Blind. Know your minimum and target. Negotiate after receiving written offer (never during interviews). Leverage: competing offers, unique skills, market demand. Negotiate total comp: base + bonus + equity + signing bonus + remote flexibility. Counter at 15-20% above their initial offer.'}],
  interview:[{q:'Design a CI/CD pipeline for deploying 200 microservices to Kubernetes',a:'<strong>Architecture:</strong> Monorepo or poly-repo with shared pipeline templates. <strong>CI:</strong> GitHub Actions/GitLab CI with reusable workflows. On PR: lint \u2192 unit test \u2192 build Docker image \u2192 security scan (Trivy) \u2192 push to Harbor. On merge to main: integration tests \u2192 push image tagged with SHA. <strong>CD:</strong> GitOps with ArgoCD (ApplicationSet for 200 services). Image Updater auto-updates manifests. Environment promotion: dev \u2192 staging (auto) \u2192 prod (manual approval + canary via Argo Rollouts). <strong>Scale concerns:</strong> Shared build cache (BuildKit), parallel test execution, artifact caching, ArgoCD sharding (multiple controllers for 200 apps). <strong>Observability:</strong> Pipeline metrics in Prometheus, deployment frequency dashboard, DORA metrics tracking.'},{q:'You get paged at 3 AM: the production website is returning 500 errors. Walk me through your troubleshooting process.',a:'<strong>1. Assess impact:</strong> Check monitoring dashboard \u2014 which services affected, error rate, user impact scope. <strong>2. Recent changes:</strong> Check deployment history \u2014 any deploys in last 2 hours? If yes, rollback immediately (fix forward later). <strong>3. Symptoms:</strong> Check logs (kubectl logs, ELK), traces (Jaeger), metrics (Prometheus). Is it one service or cascading? <strong>4. Isolate:</strong> Is it application (crash, OOM), infrastructure (node failure, disk full), or dependency (DB down, external API timeout)? <strong>5. Mitigate:</strong> Rollback, scale up, failover, disable feature flag. Priority = restore service, not find root cause. <strong>6. Communicate:</strong> Update incident channel, page relevant team if needed. <strong>7. Post-incident:</strong> Blameless postmortem, timeline, root cause, action items with owners and deadlines. Update runbooks.'}]
