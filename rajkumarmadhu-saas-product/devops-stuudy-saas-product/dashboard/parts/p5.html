<script>
// ========== LEARNING ENGINE ==========

function showPathDetail(id){
  var d=LEARN_DETAIL[id];if(!d)return;
  var el=document.getElementById('path-detail');
  if(el&&el.getAttribute('data-id')===id){el.remove();return;}
  if(el)el.remove();
  var h='<div id="path-detail" data-id="'+id+'" class="animate" style="margin-top:20px">';
  h+='<div class="card-premium" style="padding:24px">';
  h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px"><h3 style="font-size:16px;color:var(--accent)">'+d.title+'</h3><span style="font-size:12px;color:var(--text3);cursor:pointer" onclick="document.getElementById(\'path-detail\').remove()">\u2716 Close</span></div>';
  // Topics list
  h+='<div style="margin-bottom:20px"><div class="code-title">Topics Covered ('+d.topics.length+')</div><div style="display:flex;flex-wrap:wrap;gap:6px">';
  d.topics.forEach(function(t,i){h+='<span class="pill" style="background:var(--accent)12;color:var(--accent);border:1px solid var(--accent)25">'+(i+1)+'. '+t+'</span>'});
  h+='</div></div>';
  // Concept Explanation
  h+='<div style="margin-bottom:20px;padding:16px;background:var(--bg3);border-radius:var(--radius2);border-left:3px solid var(--accent)">'+d.concept+'</div>';
  // Configuration
  h+='<div style="margin-bottom:20px"><div class="code-title">\u2699\uFE0F Sample Configuration</div><div class="code-block">'+d.config+'</div></div>';
  // Errors
  h+='<div style="margin-bottom:20px"><div class="code-title">\u{1F41B} Common Errors & Fixes</div>';
  d.errors.forEach(function(e){
    h+='<div style="padding:10px;margin:6px 0;background:var(--bg);border-radius:var(--radius2);border-left:3px solid var(--red)"><div style="font-size:12px;font-weight:600;color:var(--red)">'+e.err+'</div><div style="font-size:12px;color:var(--green);margin-top:4px">\u2192 '+e.fix+'</div></div>';
  });
  h+='</div>';
  // Interview Q&A
  h+='<div><div class="code-title">\u{1F3AF} Interview Questions</div>';
  d.interview.forEach(function(qa){
    h+='<div style="padding:12px;margin:6px 0;background:var(--bg);border-radius:var(--radius2);border-left:3px solid var(--purple)"><div style="font-size:13px;font-weight:600;color:var(--purple)">Q: '+qa.q+'</div><div style="font-size:12px;color:var(--text2);margin-top:6px;line-height:1.6">'+qa.a+'</div></div>';
  });
  h+='</div></div></div>';
  // Insert after table
  var panel=document.getElementById('learn-panel-0');
  if(panel)panel.insertAdjacentHTML('beforeend',h);
}

PAGES.learning=function(){

  var h=hdr('Learning Engine','\u{1F4DA} Learning Engine','15 learning paths \u00b7 517 topics \u00b7 Adaptive AI \u00b7 Real-time labs \u00b7 Certification prep');

  // Panel 0: Paths - NOW CLICKABLE
  h+='<div id="learn-panel-0"><p style="font-size:12px;color:var(--text3);margin-bottom:12px">\u{1F449} Click any learning path to see detailed concept explanations, configs, errors & interview Q&A</p><div class="table-wrap"><table><thead><tr><th>ID</th><th>Learning Path</th><th>Topics</th><th>Level</th><th>Hours</th></tr></thead><tbody>';
  paths.forEach(function(r){
    h+='<tr style="cursor:pointer" onclick="showPathDetail(\''+r[0]+'\')" onmouseover="this.style.background=\'rgba(0,212,170,0.06)\'" onmouseout="this.style.background=\'\'"><td><span class="cell-code">'+r[0]+'</span></td><td><strong style="color:var(--accent)">'+r[1]+' \u25B6</strong></td><td style="font-size:11px;color:var(--text2)">'+r[2]+'</td><td><span class="cell-tag tag-green">'+r[3]+'</span></td><td style="font-family:JetBrains Mono,monospace;color:var(--accent)">'+r[4]+'h</td></tr>';
  });
  h+='</tbody></table></div></div>';
  // Panel 1: Components
  h+='<div id="learn-panel-1" style="display:none"><h3 style="font-size:15px;margin-bottom:16px">Every Topic Contains These 10 Components</h3><div class="grid grid-2">';
  comps.forEach(function(f){h+='<div class="card"><div style="font-size:22px;margin-bottom:8px">'+f.icon+'</div><h3 style="color:var('+f.c+')">'+f.t+'</h3><div class="desc">'+f.d+'</div></div>'});
  h+='</div></div>';
  // Panel 2: Lab
  h+='<div id="learn-panel-2" style="display:none"><h3 style="font-size:15px;margin-bottom:16px">Lab Environment Architecture</h3><div class="card" style="padding:20px"><div class="code-title">Lab Provisioning Flow</div><div class="code-block">User clicks "Start Lab"\n  \u2192 API creates lab_session record (status: provisioning)\n  \u2192 Lab Controller provisions k3s cluster (isolated namespace)\n  \u2192 Installs required tools (kubectl, helm, terraform, etc.)\n  \u2192 Seeds lab with scenario data (pods, services, broken configs)\n  \u2192 Exposes web terminal via xterm.js + WebSocket\n  \u2192 User completes tasks in browser terminal\n  \u2192 Validation engine checks task completion\n  \u2192 Auto-cleanup after TTL (2 hours) or manual stop\n  \u2192 Lab results saved to user_progress</div></div>';
  h+='<div class="grid grid-3" style="margin-top:16px">';
  [{t:'Isolation',d:'Each user gets dedicated k3s namespace with resource limits',c:'--accent'},{t:'Pre-seeded',d:'Labs come with broken configs, failing pods, misconfigured services',c:'--red'},{t:'Validation',d:'Automated task checking: verify pods running, service reachable, config correct',c:'--green'}].forEach(function(f){h+='<div class="card"><h3 style="color:var('+f.c+')">'+f.t+'</h3><div class="desc">'+f.d+'</div></div>'});
  h+='</div></div></div>';
  return h;
};
