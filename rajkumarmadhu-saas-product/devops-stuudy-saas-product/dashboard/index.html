<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Santhira — DevOps Master Platform</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=DM+Sans:wght@0,400;0,500;0,600;0,700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#0a0e17;--bg2:#0f1520;--bg3:#141b2a;--bg4:#1a2235;--border:#1e2a3f;--border2:#2a3a55;--text:#c8d6e5;--text2:#8899aa;--text3:#5a6a7a;--accent:#00d4aa;--accent2:#00b894;--accent3:#004d3d;--blue:#4da6ff;--blue2:#1a73e8;--purple:#a78bfa;--purple2:#7c3aed;--orange:#fb923c;--red:#f87171;--red2:#dc2626;--yellow:#fbbf24;--pink:#f472b6;--green:#34d399;--card:rgba(20,27,42,0.8);--glass:rgba(255,255,255,0.03);--shadow:0 4px 24px rgba(0,0,0,0.4);--radius:12px;--radius2:8px}
body.light{--bg:#f5f7fa;--bg2:#ffffff;--bg3:#eef1f6;--bg4:#e2e8f0;--border:#d1d9e6;--border2:#b8c4d4;--text:#1a2332;--text2:#4a5568;--text3:#718096;--card:rgba(255,255,255,0.9);--glass:rgba(0,0,0,0.02);--shadow:0 4px 24px rgba(0,0,0,0.08)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;transition:background .3s,color .3s}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:var(--bg2)}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
.status-bar{height:28px;background:linear-gradient(90deg,var(--bg3),var(--bg2));display:flex;align-items:center;justify-content:center;gap:8px;font-size:11px;color:var(--text3);border-bottom:1px solid var(--border)}
.status-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 6px var(--accent)}50%{opacity:.4;box-shadow:none}}
.app{display:flex;height:calc(100vh - 28px)}
.sidebar{width:260px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto;transition:background .3s}
.main{flex:1;overflow-y:auto}
.logo{padding:20px 20px 16px;border-bottom:1px solid var(--border)}
.logo h1{font-family:'JetBrains Mono',monospace;font-size:14px;background:linear-gradient(135deg,var(--accent),var(--blue));-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:1px}
.logo p{font-size:11px;color:var(--text3);margin-top:4px}
.nav{padding:12px 8px;flex:1}.nav-section{margin-bottom:16px}
.nav-section-title{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--text3);padding:4px 12px 8px;font-weight:600}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:var(--radius2);cursor:pointer;transition:all .2s;font-size:13px;color:var(--text2)}
.nav-item:hover{background:var(--glass);color:var(--text)}
.nav-item.active{background:linear-gradient(135deg,var(--accent3),rgba(0,212,170,0.1));color:var(--accent);border:1px solid rgba(0,212,170,0.2);box-shadow:0 0 15px rgba(0,212,170,0.08)}
.nav-icon{width:18px;text-align:center;font-size:14px;flex-shrink:0}
.nav-badge{margin-left:auto;font-size:10px;padding:2px 6px;border-radius:10px;background:var(--bg4);color:var(--text3);font-family:'JetBrains Mono',monospace}
.cmd-k{display:flex;align-items:center;gap:8px;margin:4px 8px 8px;padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius2);font-size:12px;color:var(--text3);cursor:pointer;transition:all .2s}
.cmd-k:hover{border-color:var(--accent);color:var(--accent)}
.cmd-k kbd{font-family:'JetBrains Mono',monospace;font-size:10px;padding:1px 4px;border-radius:3px;background:var(--bg4);border:1px solid var(--border);margin-left:auto}
.mode-toggle{display:flex;align-items:center;gap:8px;margin:0 8px 8px;padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius2);font-size:12px;color:var(--text3);cursor:pointer;transition:all .2s}
.mode-toggle:hover{border-color:var(--accent);color:var(--text)}
.sidebar-profile{padding:14px 16px;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px}
.sidebar-profile .av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--blue));display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#0a0e17}
.sidebar-profile .nm{font-size:12px;font-weight:600}
.sidebar-profile .rl{font-size:10px;color:var(--text3)}
.page-header{padding:20px 32px 16px;border-bottom:1px solid var(--border);background:var(--bg2);position:sticky;top:0;z-index:10;backdrop-filter:blur(20px);transition:background .3s}
.page-header .bcrumb{font-size:11px;color:var(--text3);margin-bottom:4px}
.page-header .bcrumb a{color:var(--accent);text-decoration:none;cursor:pointer}
.page-header .hdr-row{display:flex;align-items:center;justify-content:space-between}
.page-header h2{font-size:20px;font-weight:700}
.page-header p{font-size:12px;color:var(--text3);margin-top:3px}
.hdr-actions{display:flex;gap:10px;align-items:center}
.bell{width:34px;height:34px;border-radius:50%;background:var(--bg3);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;position:relative;transition:all .2s}
.bell:hover{border-color:var(--accent);transform:scale(1.05)}
.bell .dot{position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--red);border:2px solid var(--bg2)}
.header-stats{display:flex;gap:24px;margin-top:10px;flex-wrap:wrap}
.header-stat{display:flex;align-items:baseline;gap:6px}
.header-stat .val{font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:700}
.header-stat .label{font-size:11px;color:var(--text3)}
.content{padding:24px 32px 60px}
.grid{display:grid;gap:16px}.grid-2{grid-template-columns:repeat(2,1fr)}.grid-3{grid-template-columns:repeat(3,1fr)}.grid-4{grid-template-columns:repeat(4,1fr)}
@media(max-width:1200px){.grid-4{grid-template-columns:repeat(2,1fr)}.grid-3{grid-template-columns:repeat(2,1fr)}}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;transition:all .3s;position:relative;overflow:hidden}
.card:hover{border-color:var(--border2);transform:translateY(-2px);box-shadow:var(--shadow)}
.card-glow{position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle,rgba(0,212,170,0.04),transparent 70%);pointer-events:none}
.card h3{font-size:14px;font-weight:600;margin-bottom:6px}
.card .desc{font-size:12px;color:var(--text2);line-height:1.5}
.card .metric{font-family:'JetBrains Mono',monospace;font-size:24px;font-weight:700;margin-bottom:4px}
.card .sub{font-size:11px;color:var(--text3)}
.card-premium{position:relative;background:var(--card);border:none;padding:20px}
.card-premium::before{content:'';position:absolute;inset:0;border-radius:var(--radius);padding:1px;background:linear-gradient(135deg,var(--accent),var(--blue),var(--purple),var(--accent));background-size:300% 300%;animation:gradBorder 6s ease infinite;-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:.5;pointer-events:none}
@keyframes gradBorder{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.module-card{cursor:pointer}.module-card .module-icon{font-size:28px;margin-bottom:8px}
.module-card .module-tag{display:inline-block;font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600;margin-top:8px}
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--bg4);color:var(--text2);font-weight:600;text-transform:uppercase;font-size:10px;letter-spacing:1px;padding:10px 14px;text-align:left;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:1}
td{padding:10px 14px;border-bottom:1px solid var(--border);vertical-align:top}
tr:hover td{background:rgba(0,212,170,0.03)}
tr:last-child td{border-bottom:none}
.cell-code{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--blue)}
.cell-tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600}
.tag-green{background:rgba(0,212,170,0.15);color:var(--accent)}.tag-blue{background:rgba(77,166,255,0.15);color:var(--blue)}.tag-purple{background:rgba(167,139,250,0.15);color:var(--purple)}.tag-orange{background:rgba(251,146,60,0.15);color:var(--orange)}.tag-red{background:rgba(248,113,113,0.15);color:var(--red)}.tag-yellow{background:rgba(251,191,36,0.15);color:var(--yellow)}.tag-pink{background:rgba(244,114,182,0.15);color:var(--pink)}
.tabs{display:flex;gap:2px;background:var(--bg3);border-radius:var(--radius2);padding:3px;margin-bottom:20px;overflow-x:auto}
.tab{padding:8px 16px;border-radius:6px;font-size:12px;font-weight:500;color:var(--text3);cursor:pointer;transition:all .2s;white-space:nowrap}
.tab:hover{color:var(--text)}.tab.active{background:var(--bg);color:var(--accent);box-shadow:0 2px 8px rgba(0,0,0,0.3)}
.code-block{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius2);padding:16px;font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.7;overflow-x:auto;color:var(--text2);white-space:pre;margin:12px 0}
.code-title{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;font-weight:600}
.search-box{position:relative;margin-bottom:20px}
.search-box input{width:100%;padding:12px 16px 12px 40px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius2);color:var(--text);font-size:13px;outline:none;font-family:'DM Sans',sans-serif;transition:all .2s}
.search-box input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,212,170,0.1)}
.search-box .si{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:14px}
.flow-step{display:flex;gap:16px;padding:16px;background:var(--bg3);border-radius:var(--radius2);margin-bottom:8px;border-left:3px solid;transition:all .2s}
.flow-step:hover{transform:translateX(4px)}
.flow-step .step-num{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.flow-step .step-content h4{font-size:13px;font-weight:600;margin-bottom:4px}
.flow-step .step-content p{font-size:12px;color:var(--text2);line-height:1.5}
.pill{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600}
.arch-flow{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;padding:20px}
.arch-node{padding:10px 16px;border-radius:var(--radius2);border:1px solid;font-size:11px;font-weight:600;text-align:center;min-width:100px;transition:all .2s}
.arch-node:hover{transform:scale(1.05)}
.arch-arrow{color:var(--text3);font-size:18px;display:flex;align-items:center}
.stat-bar{display:flex;align-items:center;gap:10px;margin:6px 0}
.stat-bar-fill{height:6px;border-radius:3px;transition:width 1s ease}
.stat-bar-track{flex:1;height:6px;border-radius:3px;background:var(--bg4);overflow:hidden}
.stat-bar-label{font-size:11px;color:var(--text3);min-width:40px;text-align:right;font-family:'JetBrains Mono',monospace}
.terminal{background:#0c0c0c;border:1px solid #333;border-radius:var(--radius);font-family:'JetBrains Mono',monospace;font-size:12px;overflow:hidden}
.terminal-bar{background:#1a1a2e;padding:8px 12px;display:flex;gap:6px;align-items:center}
.terminal-bar span{width:10px;height:10px;border-radius:50%}
.terminal-body{padding:16px;line-height:1.8;min-height:220px;color:var(--accent)}
.chart-wrap{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes pageIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.animate{animation:fadeIn .4s ease forwards}.delay-1{animation-delay:.05s;opacity:0}.delay-2{animation-delay:.1s;opacity:0}.delay-3{animation-delay:.15s;opacity:0}.delay-4{animation-delay:.2s;opacity:0}
.page-enter{animation:pageIn .3s ease}
.toast{position:fixed;bottom:80px;right:24px;background:var(--bg3);border:1px solid var(--accent);border-radius:var(--radius);padding:14px 20px;font-size:13px;color:var(--text);z-index:1000;animation:slideToast .5s ease,fadeToast .5s ease 3s forwards;box-shadow:0 8px 32px rgba(0,212,170,0.2)}
@keyframes slideToast{from{transform:translateY(100px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes fadeToast{to{opacity:0;transform:translateY(20px)}}
.fab{position:fixed;bottom:24px;right:24px;width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--blue));border:none;color:#fff;font-size:22px;cursor:pointer;box-shadow:0 4px 20px rgba(0,212,170,0.4);z-index:100;transition:all .3s;display:flex;align-items:center;justify-content:center}
.fab:hover{transform:scale(1.1);box-shadow:0 6px 30px rgba(0,212,170,0.6)}
.footer{padding:12px 32px;border-top:1px solid var(--border);font-size:11px;color:var(--text3);display:flex;justify-content:space-between;background:var(--bg2);border-radius:var(--radius);margin-top:32px}
.sidebar-toggle{display:none;position:fixed;top:40px;left:12px;z-index:100;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:8px 12px;color:var(--text);cursor:pointer;font-size:16px}
@media(max-width:900px){.sidebar{position:fixed;left:-260px;top:28px;bottom:0;z-index:50;transition:left .3s}.sidebar.open{left:0}.sidebar-toggle{display:block}.content{padding:24px 16px}.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="status-bar"><span class="status-dot"></span><span>All systems operational</span><span style="margin-left:auto;font-family:JetBrains Mono,monospace;margin-right:12px">v2.0.0</span></div>
<button class="sidebar-toggle" onclick="document.querySelector('.sidebar').classList.toggle('open')">&#9776;</button>
<div class="app">
<div class="sidebar">
  <div class="logo"><h1>&#9889; SANTHIRA</h1><p>DevOps Master Platform v2.0</p></div>
  <div class="cmd-k"><span>&#128269;</span> Search platform...<kbd>Ctrl+K</kbd></div>
  <nav class="nav" id="nav"></nav>
  <div class="mode-toggle" id="modeToggle" onclick="toggleMode()"><span id="modeIcon">&#127769;</span><span id="modeLabel">Dark Mode</span></div>
  <div class="sidebar-profile"><div class="av">RM</div><div><div class="nm">Rajkumar Madhu</div><div class="rl">Founder &amp; CTO</div></div></div>
</div>
<div class="main" id="main"></div>
</div>
<div class="fab" onclick="goTo('troubleshoot')" title="Quick Troubleshoot">&#128295;</div>

<script>
var PAGES={},afterRender={},chartInstances={};
Chart.defaults.color='#8899aa';Chart.defaults.borderColor='#1e2a3f';

function toggleMode(){
  document.body.classList.toggle('light');
  var L=document.body.classList.contains('light');
  document.getElementById('modeIcon').innerHTML=L?'&#9728;&#65039;':'&#127769;';
  document.getElementById('modeLabel').textContent=L?'Light Mode':'Dark Mode';
  Chart.defaults.borderColor=L?'#d1d9e6':'#1e2a3f';
  Chart.defaults.color=L?'#4a5568':'#8899aa';
  localStorage.setItem('santhira-mode',L?'light':'dark');
}
if(localStorage.getItem('santhira-mode')==='light'){document.body.classList.add('light');document.getElementById('modeIcon').innerHTML='&#9728;&#65039;';document.getElementById('modeLabel').textContent='Light Mode';}

var NAV=[
  {section:"Platform",items:[{id:"overview",icon:"\u{1F3E0}",label:"Overview",badge:""},{id:"architecture",icon:"\u{1F3D7}\uFE0F",label:"Architecture",badge:"16"},{id:"techstack",icon:"\u2699\uFE0F",label:"Tech Stack",badge:"21"}]},
  {section:"Core Modules",items:[{id:"learning",icon:"\u{1F4DA}",label:"Learning Engine",badge:"15"},{id:"deploy",icon:"\u{1F680}",label:"Deployment Engine",badge:"100+"},{id:"troubleshoot",icon:"\u{1F527}",label:"Troubleshooter AI",badge:"10K+"},{id:"interview",icon:"\u{1F3AF}",label:"Interview Engine",badge:"500+"},{id:"analyzer",icon:"\u{1F4CA}",label:"Log Analyzer",badge:""},{id:"expander",icon:"\u2728",label:"5-Point Expander",badge:""},{id:"configvault",icon:"\u{1F510}",label:"Config Vault",badge:"520+"}]},
  {section:"Reference",items:[{id:"api",icon:"\u{1F50C}",label:"API Endpoints",badge:"47"},{id:"errors",icon:"\u{1F41B}",label:"Error Catalog",badge:"10K+"},{id:"coverage",icon:"\u{1F4C8}",label:"Content Matrix",badge:""},{id:"roadmap",icon:"\u{1F5FA}\uFE0F",label:"Roadmap & Revenue",badge:""}]},
  {section:"Operations",items:[{id:"analytics",icon:"\u{1F4C9}",label:"Analytics",badge:"Live"},{id:"team",icon:"\u{1F465}",label:"Team & Settings",badge:""},{id:"security",icon:"\u{1F6E1}\uFE0F",label:"Security",badge:""},{id:"integrations",icon:"\u{1F517}",label:"Integrations",badge:"12"}]}
];

function renderNav(){
  document.getElementById('nav').innerHTML=NAV.map(function(s){
    return '<div class="nav-section"><div class="nav-section-title">'+s.section+'</div>'+s.items.map(function(i){
      return '<div class="nav-item'+(i.id==='overview'?' active':'')+'" data-page="'+i.id+'" onclick="goTo(\''+i.id+'\')"><span class="nav-icon">'+i.icon+'</span><span>'+i.label+'</span>'+(i.badge?'<span class="nav-badge">'+i.badge+'</span>':'')+'</div>';
    }).join('')+'</div>';
  }).join('');
}
function goTo(id){
  document.querySelectorAll('.nav-item').forEach(function(e){e.classList.remove('active')});
  var el=document.querySelector('[data-page="'+id+'"]');if(el)el.classList.add('active');
  document.querySelector('.sidebar').classList.remove('open');
  renderPage(id);
}
function renderPage(id){
  var m=document.getElementById('main');
  m.style.opacity='0';
  setTimeout(function(){
    if(PAGES[id])m.innerHTML=PAGES[id]();
    m.scrollTop=0;m.classList.add('page-enter');m.style.opacity='1';
    if(afterRender[id])setTimeout(afterRender[id],300);
    setTimeout(function(){m.classList.remove('page-enter')},400);
  },120);
}
function switchTab(p,i){
  document.querySelectorAll('#'+p+'-tabs .tab').forEach(function(t,j){t.classList.toggle('active',j===i)});
  for(var j=0;j<10;j++){var el=document.getElementById(p+'-panel-'+j);if(el)el.style.display=j===i?'block':'none'}
}
function filterTable(inp,tid){
  var q=inp.value.toLowerCase();
  document.getElementById(tid).querySelectorAll('tbody tr').forEach(function(r){r.style.display=r.textContent.toLowerCase().includes(q)?'':'none'});
}
function animateCounter(el,target,suffix){
  suffix=suffix||'';var start=0,dur=1200,step=target/(dur/16);
  var t=setInterval(function(){start+=step;if(start>=target){el.textContent=target.toLocaleString()+suffix;clearInterval(t)}else el.textContent=Math.floor(start).toLocaleString()+suffix},16);
}
function destroyChart(k){if(chartInstances[k]){chartInstances[k].destroy();delete chartInstances[k]}}
function hdr(crumb,title,desc){
  return '<div class="page-header"><div class="bcrumb"><a onclick="goTo(\'overview\')">Home</a> / '+crumb+'</div><div class="hdr-row"><div><h2>'+title+'</h2><p>'+desc+'</p></div><div class="hdr-actions"><div class="bell" title="Notifications">\u{1F514}<span class="dot"></span></div></div></div></div>';
}
function tbl(headers,rows){
  return '<div class="table-wrap"><table><thead><tr>'+headers.map(function(h){return '<th>'+h+'</th>'}).join('')+'</tr></thead><tbody>'+rows+'</tbody></table></div>';
}
</script>

<script>
// ========== OVERVIEW ==========
PAGES.overview=function(){
  var modules=[
    {icon:"\u{1F4DA}",title:"Learning Engine",desc:"15 learning paths, 500+ hrs, adaptive AI, real labs",color:"var(--accent)",tag:"Core",pg:"learning"},
    {icon:"\u{1F680}",title:"Deployment Engine",desc:"100+ tools, one-click deploy, Helm/Terraform templates",color:"var(--blue)",tag:"Core",pg:"deploy"},
    {icon:"\u{1F527}",title:"Troubleshooter AI",desc:"10,000+ errors, instant RCA, step-by-step fixes",color:"var(--red)",tag:"AI",pg:"troubleshoot"},
    {icon:"\u{1F3AF}",title:"Interview Engine",desc:"500+ Q&A, mock AI interviews, scoring & feedback",color:"var(--purple)",tag:"Core",pg:"interview"},
    {icon:"\u{1F4CA}",title:"Log Analyzer",desc:"Upload logs \u2192 AI analysis, anomaly detection, reports",color:"var(--orange)",tag:"AI",pg:"analyzer"},
    {icon:"\u2728",title:"5-Point Expander",desc:"5 keywords \u2192 complete docs with configs & diagrams",color:"var(--yellow)",tag:"AI",pg:"expander"},
    {icon:"\u{1F510}",title:"Config Vault",desc:"520+ production configs, env-specific, versioned",color:"var(--green)",tag:"Core",pg:"configvault"},
    {icon:"\u{1F3D7}\uFE0F",title:"Arch Generator",desc:"Describe \u2192 full architecture with implementation guide",color:"var(--pink)",tag:"AI",pg:"architecture"}
